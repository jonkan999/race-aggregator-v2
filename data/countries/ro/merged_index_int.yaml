about_us:
  title: About Calendar Alergări
  meta_description: Calendar Alergări - Your guide to running in Romania
  content:
    intro: Welcome to Calendar Alergări - The most complete platform for runners in Romania!
    mission: Our mission is to make it easy for runners to find and share information about races, training and everything related to running.
    story: Calendar Alergări was started in 2023 by runners for runners. We saw the need for a modern and user-friendly platform where the running community could gather.
    features:
    - title: Complete Race List
      description: We gather all races in Romania in one place - from small local races to large international events.
    - title: Community-Driven
      description: Our platform is driven by runners like you. Anyone can contribute with information about races and participate in discussions.
    - title: Free Tools
      description: We offer useful tools like pace calculators, training programs and route planning - completely free.
    closing: We continue to develop the platform based on feedback from our users. Do you have suggestions for improvements? Please contact us!
contact:
  title: Contact Us
  meta_description: Contact Calendar Alergări - We are here to help you
  content:
    intro: 'We would love to hear from you! Here are different ways to reach us:'
    email:
      title: Email
      address: loppkartan@gmail.com
      description: We normally respond within 24 hours on weekdays.
    social:
      title: Social Media
      description: 'Follow us on social media for the latest news and updates:'
    feedback:
      title: Feedback
      description: We appreciate all feedback that helps us improve Calendar Alergări.
privacy_page:
  title: Privacy Policy
  meta_description: Privacy policy and information about how Calendar Alergări handles personal data and cookies.
  last_updated_label: Last updated
  last_updated_date: March 27, 2026
  contact_intro: 'For privacy-related questions and requests, please contact us at:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Information We Collect
    intro: 'We collect information that you provide directly to us when you:'
    bullets:
    - Create an account
    - Submit race information
    - Post in the forum
    - Contact us
  - title: 2. Cookies and Tracking
    intro: 'We use cookies to:'
    bullets:
    - Remember your preferences
    - Maintain your session and login state
    - Analyze traffic and site usage
    - Show relevant advertising and improve the experience
  - title: 3. How We Use Your Information
    intro: 'Your information helps us to:'
    bullets:
    - Provide and improve our services
    - Send important notifications and updates
    - Respond to requests and support questions
    - Prevent fraud and abuse
  - title: 4. Your Rights
    intro: 'Under GDPR, you have the right to:'
    bullets:
    - Access your personal data
    - Correct inaccurate or incomplete data
    - Request deletion of your data
    - Object to certain processing activities
    - Request data portability
  - title: 5. Contact Us
    intro: If you have questions about how we process personal data or use cookies, you are always welcome to reach out.
