about_us:
  title: Despre Calendar Alergări
  meta_description: Calendar Alergări - Ghidul tău pentru alergare în România
  content:
    intro: Bine ai venit la Calendar Alergări - Platforma cea mai completă pentru alergători din România!
    mission: Misiunea noastră este să facem ușor pentru alergători să găsească și să împărtășească informații despre curse, antrenamente și tot ce ține de alergare.
    story: Calendar Alergări a fost lansat în 2023 de către alergători pentru alergători. Am văzut nevoia unei platforme moderne și prietenoase pentru comunitatea de alergare.
    features:
    - title: Listă completă de curse
      description: Adunăm toate cursele din România într-un singur loc - de la curse locale mici până la evenimente internaționale mari.
    - title: Orientat către Comunitate
      description: Platforma noastră este condusă de alergători ca tine. Oricine poate contribui cu informații despre curse și poate participa la discuții.
    - title: Unelte Gratuite
      description: Oferim unelte utile precum calculatoare de ritm, programe de antrenament și planificare a traseului - complet gratuite.
    closing: Continuăm să dezvoltăm platforma bazându-ne pe feedback-ul utilizatorilor noștri. Ai sugestii pentru îmbunătățiri? Te rugăm să ne contactezi!
contact:
  title: Contactează-ne
  meta_description: Calendar de Alergări - Suntem aici să te ajutăm
  content:
    intro: 'Ne-ar plăcea să auzim de la tine! Iată diferite moduri de a ne contacta:'
    email:
      title: Email
      address: loppkartan@gmail.com
      description: Răspundem de obicei în 24 de ore în zilele lucrătoare.
    social:
      title: Rețele Sociale
      description: 'Urmărește-ne pe rețelele sociale pentru cele mai recente noutăți și actualizări:'
    feedback:
      title: Feedback
      description: Apreciem orice feedback care ne ajută să îmbunătățim Calendarul de Alergări.
privacy_page:
  title: Politica de Confidențialitate
  meta_description: Politica de confidențialitate și informații despre modul în care Calendarul de Alergări gestionează datele personale și cookie-urile.
  last_updated_label: Ultima actualizare
  last_updated_date: 27 martie 2026
  contact_intro: 'Pentru întrebări și solicitări legate de confidențialitate, te rugăm să ne contactezi la:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Informații pe care le colectăm
    intro: 'Colectăm informații pe care ni le furnizezi direct atunci când:'
    bullets:
    - Creezi un cont
    - Trimiti informații despre curse
    - ' Postezi în forum'
    - Ne contactezi
  - title: 2. Cookie-uri și urmărire
    intro: 'Folosim cookie-uri pentru a:'
    bullets:
    - Ține minte preferințele tale
    - Menține sesiunea și starea de autentificare
    - Analizează traficul și utilizarea site-ului
    - Afișează publicitate relevantă și îmbunătățește experiența
  - title: 3. Cum folosim informațiile tale
    intro: 'Informațiile tale ne ajută să:'
    bullets:
    - Oferim și îmbunătățim serviciile noastre
    - Trimitem notificări importante și actualizări
    - Răspundem la solicitări și întrebări de suport
    - Prevenim frauda și abuzurile
  - title: 4. Drepturile tale
    intro: 'Conform GDPR, ai dreptul să:'
    bullets:
    - Accesezi datele tale personale
    - Corectezi datele incorecte sau incomplete
    - Soliciti ștergerea datelor tale
    - Te opui anumitor activități de procesare
    - Soliciti portabilitatea datelor
  - title: 5. Contactează-ne
    intro: Dacă ai întrebări despre modul în care procesăm datele personale sau folosim cookie-urile, nu ezita să ne contactezi.
