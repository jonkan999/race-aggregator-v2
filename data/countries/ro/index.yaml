seo_templates:
  title_parts:
    category: Curse {category}
    race_type: '{race_type}'
    location: în {location}
    default: Toate cursele
  paragraph_templates:
    category_race_location: Găsește curse {category} {race_type} în {location}.
    category_race: Explorează curse {category} {race_type} din întreaga Românie.
    category_location: Descoperă curse {category} în {location}.
    race_location: Vezi toate cursele {race_type} în {location}.
    category_only: Găsește curse {category} în întreaga Românie.
    race_only: Explorează curse {race_type} în toate regiunile.
    location_only: Vezi toate tipurile de curse în {location}.
    default_suffix: Aici vei găsi date, distanțe și toate informațiile de care ai nevoie pentru a-ți planifica următoarea cursă.
  browse_page_templates:
    county:
      title: '{label} curse | {site_name}'
      meta_description: Răsfoiește cursele de alergare din {label}. Compară datele, distanțele, formatul cursei și detaliile practice înainte de a-ți alege următoarea cursă.
      h1: Curse în {label}
      paragraph: Această pagină de destinație reunește cursele de alergare din {label} pentru a fi mai ușor să compari datele, distanțele, formatele cursei și detaliile practice într-un singur loc. Folosește-o atunci când vrei o vedere mai clară înainte de a alege următoarea cursă.
    city:
      title: '{label} curse | {site_name}'
      meta_description: Găsește curse de alergare legate de {label}. Compară datele, distanțele, opțiunile din apropiere și detaliile practice înainte de a-ți alege următoarea cursă.
      h1: Curse aproape de {label}
      paragraph: Această pagină a orașului te ajută să navighezi printre cursele de alergare legate de {label}, inclusiv alternative din apropiere relevante atunci când planifici o zi de cursă sau o excursie. Este construită pentru a face descoperirea curselor locale mai rapidă și mai ușoară pentru comparație.
    month:
      title: '{label} curse | {site_name}'
      meta_description: Răsfoiește cursele de alergare din {label} în {market}. Compară datele, distanțele, tipurile de curse și detaliile practice înainte de a-ți planifica sezonul.
      h1: Curse în {label}
      paragraph: Această pagină este pentru alergători care doresc o vedere lunară a calendarului și au nevoie de o modalitate mai rapidă de a compara ce se întâmplă în {label}. Te ajută să restrângi opțiunile înainte de a analiza distanțele, suprafețele și locațiile cursei.
    race_type:
      title: '{label} curse în {market} | {site_name}'
      meta_description: Răsfoiește cursele {label_lower} în {market}. Compară datele, distanțele, locațiile și detaliile practice înainte de a alege o cursă care ți se potrivește.
      h1: '{label} curse în {market}'
      paragraph: Această pagină se concentrează pe cursele {label_lower} și îți oferă o vedere mai clară atunci când formatul cursei contează la fel de mult ca și distanța. Folosește-o pentru a compara opțiunile din regiuni, date și detalii practice fără a începe de la calendarul complet.
    category:
      title: '{label} curse în {market} | {site_name}'
      meta_description: Răsfoiește cursele {label} în {market}. Compară datele, tipurile de curse, locațiile și detaliile practice înainte de a decide următorul eveniment.
      h1: '{label} curse în {market}'
      paragraph: Această pagină de distanță și categorie reunește curse care se potrivesc cu {label} pentru a fi mai ușor să compari opțiunile relevante într-un singur loc. Este destinată alergătorilor care doresc o cale mai rapidă de la navigarea largă la o listă scurtă de curse realiste.
    race_type_category:
      title: '{label} {secondary_label} curse în {market} | {site_name}'
      meta_description: Explorează cursele {label} în {market} în cadrul tipului de cursă {secondary_label_lower}. Compară datele, locațiile și detaliile practice înainte de a-ți alege următorul eveniment.
      h1: Curse {label} în {market} ({secondary_label})
      paragraph: Această pagină restrânge calendarul la cursele {label} din cadrul tipului de cursă {secondary_label_lower}, ceea ce este util atunci când atât distanța, cât și formatul cursei influențează alegerea potrivită. Folosește-o pentru a compara opțiuni similare înainte de a te decide pentru o cursă.
    race_type_county:
      title: '{secondary_label} curse în {label} | {site_name}'
      meta_description: Explorează cursele {secondary_label_lower} în {label}. Compară datele, distanțele și detaliile practice înainte de a-ți alege următoarea cursă.
      h1: Curse {secondary_label} în {label}
      paragraph: Această pagină se concentrează pe cursele {secondary_label_lower} din {label}, facilitând compararea opțiunilor relevante din aceeași regiune. Este utilă atunci când atât geografia, cât și formatul cursei influențează lista scurtă.
    race_type_month:
      title: '{secondary_label} curse în {label} | {site_name}'
      meta_description: Explorează cursele {secondary_label_lower} în {label_lower}. Compară datele, distanțele și detaliile practice în timp ce îți planifici sezonul.
      h1: Curse {secondary_label} în {label}
      paragraph: Această pagină reunește cursele {secondary_label_lower} din {label_lower} pentru alergători care planifică în primul rând în funcție de calendar. Te ajută să compari formate de curse similare înainte de a restrânge opțiunile după loc sau distanță.
    race_type_city:
      title: '{secondary_label} curse aproape de {label} | {site_name}'
      meta_description: Explorează cursele {secondary_label_lower} legate de {label}. Compară datele, distanțele și opțiunile din apropiere înainte de a-ți alege următoarea cursă.
      h1: Curse {secondary_label} aproape de {label}
      paragraph: Această pagină adună cursele {secondary_label_lower} conectate la {label} pentru a face descoperirea curselor locale mai rapidă și mai ușoară. Este utilă când dorești o anumită formă de cursă aproape de un oraș, fără a începe de la întregul calendar.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Scrii texte SEO evergreen pentru pagini de navigare indexabile ale curselor de alergare. Scrie mai întâi pentru oameni, apoi pentru intenția de căutare. Returnează doar JSON valid. Menține textul atemporal: nu menționa un an curent, numere curente, expresii de timp limitat sau afirmații despre prospețime. Evită umplerea cu cuvinte cheie, hype-ul, clickbait-ul, superlativele și afirmațiile neverificabile. Fiecare pagină trebuie să fie clar distinctă în funcție de contextul rutei furnizate. Folosește un engleză naturală potrivită pentru un calendar de alergare în România. Preferă titluri concise, H1-uri concise, meta descrieri de aproximativ 120-160 de caractere când este posibil, și un paragraf de 2-3 propoziții scurte.'
  browse_guidance:
    county: Utilizatorul dorește curse într-o regiune.
    city: Utilizatorul dorește curse legate de un oraș sau orașe apropiate.
    month: Utilizatorul dorește curse după lună.
    race_type: Utilizatorul dorește un tip specific de cursă.
    category: Utilizatorul dorește o categorie sau distanță specifică de cursă.
    race_type_category: Utilizatorul dorește o distanță/categorie specifică în cadrul unui tip de cursă.
    race_type_county: Utilizatorul dorește un tip de cursă specific într-o regiune.
    race_type_month: Utilizatorul dorește un tip de cursă specific într-o lună.
    race_type_city: Utilizatorul dorește un tip de cursă specific legat de un oraș.
