about_us:
  title: O BiegajPL
  meta_description: BiegajPL - Twój przewodnik po bieganiu w Polsce
  content:
    intro: Witamy w BiegajPL - najbardziej kompletną platformą dla biegaczy w Polsce!
    mission: Naszą misją jest ułatwienie biegaczom znajdowania i dzielenia się informacjami o biegach, treningach i wszystkim, co dotyczy biegania.
    story: BiegajPL została uruchomiona w 2023 roku przez biegaczy dla biegaczy. Zauważyliśmy potrzebę nowoczesnej i przyjaznej dla użytkownika platformy, gdzie polska społeczność biegaczy mogłaby się gromadzić.
    features:
    - title: Kompletny wykaz biegów
      description: Zbieramy wszystkie polskie biegi w jednym miejscu - od małych lokalnych zawodów po duże międzynarodowe wydarzenia.
    - title: Społecznościowy
      description: Nasza platforma jest prowadzona przez biegaczy takich jak Ty. Każdy może wnosić informacje o biegach i uczestniczyć w dyskusjach.
    - title: Darmowe Narzędzia
      description: Oferujemy przydatne narzędzia, takie jak kalkulatory prędkości, programy treningowe i planowanie tras - całkowicie za darmo.
    closing: Kontynuujemy rozwój platformy na podstawie opinii naszych użytkowników. Masz pomysły na ulepszenia? Skontaktuj się z nami!
contact:
  title: Skontaktuj się z nami
  meta_description: Skontaktuj się z BiegajPL - Jesteśmy tutaj, aby Ci pomóc
  content:
    intro: 'Chętnie usłyszymy od Ciebie! Oto różne sposoby, aby się z nami skontaktować:'
    email:
      title: E-mail
      address: loppkartan@gmail.com
      description: Zazwyczaj odpowiadamy w ciągu 24 godzin w dni robocze.
    social:
      title: Media Społecznościowe
      description: 'Śledź nas w mediach społecznościowych, aby być na bieżąco z najnowszymi informacjami i aktualizacjami:'
    feedback:
      title: Opinie
      description: Doceniamy wszelkie opinie, które pomagają nam ulepszyć BiegajPL.
privacy_page:
  title: Polityka prywatności
  meta_description: Polityka prywatności i informacje o tym, jak BiegajPL przetwarza dane osobowe i pliki cookies.
  last_updated_label: Ostatnia aktualizacja
  last_updated_date: 27 marca 2026
  contact_intro: 'W sprawach związanych z prywatnością i ochroną danych skontaktuj się z nami pod adresem:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Jakie informacje zbieramy
    intro: 'Zbieramy informacje, które przekazujesz nam bezpośrednio, gdy:'
    bullets:
    - tworzysz konto
    - przesyłasz informacje o biegu
    - publikujesz posty na forum
    - kontaktujesz się z nami
  - title: 2. Pliki cookie i śledzenie
    intro: 'Używamy plików cookie, aby:'
    bullets:
    - zapamiętywać Twoje preferencje
    - utrzymywać sesję i stan logowania
    - analizować ruch i sposób korzystania z serwisu
    - wyświetlać trafne reklamy i poprawiać komfort korzystania
  - title: 3. Jak wykorzystujemy Twoje dane
    intro: 'Twoje dane pomagają nam:'
    bullets:
    - świadczyć i ulepszać nasze usługi
    - wysyłać ważne powiadomienia i aktualizacje
    - odpowiadać na prośby i pytania dotyczące wsparcia
    - zapobiegać oszustwom i nadużyciom
  - title: 4. Twoje prawa
    intro: 'Zgodnie z RODO masz prawo do:'
    bullets:
    - dostępu do swoich danych osobowych
    - poprawienia nieprawidłowych lub niekompletnych danych
    - żądania usunięcia swoich danych
    - sprzeciwu wobec niektórych działań związanych z przetwarzaniem
    - żądania przenoszenia danych
  - title: 5. Kontakt
    intro: Jeśli masz pytania dotyczące tego, jak przetwarzamy dane osobowe lub korzystamy z plików cookie, zawsze możesz się z nami skontaktować.
