seo_templates:
  title_parts:
    category: '{category} biegi'
    race_type: '{race_type}'
    location: w {location}
    default: Wszystkie biegi
  paragraph_templates:
    category_race_location: Znajdź {category} biegi typu {race_type} w {location}.
    category_race: Odkryj {category} biegi typu {race_type} w całej Polsce.
    category_location: Odkryj {category} biegi w {location}.
    race_location: Zobacz wszystkie biegi typu {race_type} w {location}.
    category_only: Znajdź biegi w kategorii {category} w całej Polsce.
    race_only: Odkryj biegi typu {race_type} we wszystkich województwach.
    location_only: Zobacz wszystkie rodzaje biegów w {location}.
    default_suffix: Tutaj znajdziesz daty, dystanse i wszystkie informacje, których potrzebujesz, aby zaplanować swój następny bieg.
  browse_page_templates:
    county:
      title: '{label} biegi | {site_name}'
      meta_description: Przeglądaj biegi w {label}. Porównuj terminy, dystanse, formaty zawodów i praktyczne informacje przed wyborem kolejnego startu.
      h1: Biegi w {label}
      paragraph: Ta strona zbiera biegi w {label}, aby łatwiej było porównywać terminy, dystanse, formaty zawodów i praktyczne informacje w jednym miejscu. Sprawdza się, gdy chcesz mieć lepszy przegląd przed wyborem kolejnego startu.
    city:
      title: '{label} biegi | {site_name}'
      meta_description: Znajdź biegi powiązane z {label}. Porównuj terminy, dystanse, pobliskie opcje i praktyczne informacje przed wyborem kolejnego startu.
      h1: Biegi w okolicach {label}
      paragraph: Ta strona miejska pomaga przeglądać biegi powiązane z {label}, w tym pobliskie alternatywy przydatne podczas planowania startu lub wyjazdu. Powstała po to, aby lokalne odkrywanie biegów było szybsze i łatwiejsze do porównania.
    month:
      title: '{label} biegi | {site_name}'
      meta_description: Przeglądaj biegi w {label} w {market}. Porównuj terminy, dystanse, typy biegów i praktyczne informacje podczas planowania sezonu.
      h1: Biegi w {label}
      paragraph: Ta strona jest dla biegaczy, którzy chcą oglądać kalendarz miesiąc po miesiącu i szybciej porównywać to, co dzieje się w {label}. Pomaga zawęzić wybór, zanim przejdziesz do porównywania dystansów, nawierzchni i lokalizacji.
    race_type:
      title: '{label} biegi w {market} | {site_name}'
      meta_description: Przeglądaj {label_lower} biegi w {market}. Porównuj terminy, dystanse, lokalizacje i praktyczne informacje przed wyborem startu odpowiedniego dla Ciebie.
      h1: '{label} biegi w {market}'
      paragraph: Ta strona skupia się na biegach typu {label_lower} i daje czytelniejszy przegląd wtedy, gdy format zawodów jest równie ważny jak dystans. Użyj jej, aby porównywać opcje między województwami, terminami i praktycznymi szczegółami bez zaczynania od całego kalendarza.
    category:
      title: '{label} biegi w {market} | {site_name}'
      meta_description: Przeglądaj biegi {label} w {market}. Porównuj terminy, typy biegów, lokalizacje i praktyczne informacje przed wyborem kolejnego startu.
      h1: '{label} biegi w {market}'
      paragraph: Ta strona dystansu i kategorii zbiera biegi pasujące do {label}, aby łatwiej było porównać najtrafniejsze opcje w jednym miejscu. Jest przeznaczona dla biegaczy, którzy chcą szybciej przejść od szerokiego przeglądu do krótkiej listy realnych startów.
    race_type_category:
      title: '{label} biegi {secondary_label} w {market} | {site_name}'
      meta_description: Przeglądaj biegi {label} w {market} w ramach typu {secondary_label_lower}. Porównuj terminy, lokalizacje i praktyczne informacje przed wyborem kolejnego startu.
      h1: '{label} biegi w {market} ({secondary_label})'
      paragraph: Ta strona zawęża kalendarz do biegów {label} w ramach typu {secondary_label_lower}, co pomaga wtedy, gdy zarówno dystans, jak i format zawodów wpływają na wybór. Użyj jej, aby porównać naprawdę podobne opcje przed zapisaniem się na bieg.
    race_type_county:
      title: '{secondary_label} biegi w {label} | {site_name}'
      meta_description: Przeglądaj biegi typu {secondary_label_lower} w {label}. Porównuj terminy, dystanse i praktyczne informacje przed wyborem kolejnego startu.
      h1: '{secondary_label} biegi w {label}'
      paragraph: Ta strona skupia się na biegach typu {secondary_label_lower} w {label}, dzięki czemu łatwiej porównać bardziej trafne opcje w tym samym regionie. Przydaje się wtedy, gdy na krótką listę wpływają zarówno geografia, jak i format zawodów.
    race_type_month:
      title: '{secondary_label} biegi w {label} | {site_name}'
      meta_description: Przeglądaj biegi typu {secondary_label_lower} w {label_lower}. Porównuj terminy, dystanse i praktyczne informacje podczas planowania sezonu.
      h1: '{secondary_label} biegi w {label}'
      paragraph: Ta strona zbiera biegi typu {secondary_label_lower} w {label_lower} dla biegaczy, którzy najpierw planują kalendarz. Pomaga porównywać podobne formaty zawodów, zanim zawęzisz wybór według miejsca lub dystansu.
    race_type_city:
      title: '{secondary_label} biegi w okolicach {label} | {site_name}'
      meta_description: Przeglądaj biegi typu {secondary_label_lower} powiązane z {label}. Porównuj terminy, dystanse i pobliskie opcje przed wyborem kolejnego startu.
      h1: '{secondary_label} biegi w okolicach {label}'
      paragraph: Ta strona zbiera biegi typu {secondary_label_lower} powiązane z {label}, aby lokalne odkrywanie startów było szybsze i łatwiejsze do porównania. Przydaje się, gdy szukasz konkretnego formatu biegu w pobliżu jednego miasta bez zaczynania od całego kalendarza.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Tworzysz ponadczasowe treści SEO dla indeksowalnych stron przeglądowych z kalendarzem biegów. Pisz najpierw dla ludzi, dopiero potem pod intencję wyszukiwania. Zwracaj wyłącznie poprawny JSON. Tekst ma być ponadczasowy: nie wspominaj o bieżącym roku, aktualnych liczbach, chwilowych kampaniach ani świeżości danych. Unikaj upychania słów kluczowych, przesadnego marketingu, clickbaitu, superlatywów i twierdzeń, których nie da się zweryfikować. Każdą stronę wyraźnie różnicuj na podstawie przekazanego kontekstu trasy. Używaj naturalnego polskiego odpowiedniego dla kalendarza biegów w Polsce. Preferuj zwięzłe tytuły, krótkie H1, meta opisy w granicach 120-160 znaków, gdy to praktyczne, oraz akapit z 2-3 krótkimi zdaniami.'
  browse_guidance:
    county: Użytkownik szuka biegów w jednym regionie.
    city: Użytkownik szuka biegów powiązanych z miastem lub pobliskim miastem.
    month: Użytkownik szuka biegów według miesiąca.
    race_type: Użytkownik szuka konkretnego typu biegu.
    category: Użytkownik szuka konkretnego dystansu lub kategorii biegu.
    race_type_category: Użytkownik szuka konkretnego dystansu lub kategorii w ramach jednego typu biegu.
    race_type_county: Użytkownik szuka konkretnego typu biegu w jednym regionie.
    race_type_month: Użytkownik szuka konkretnego typu biegu w jednym miesiącu.
    race_type_city: Użytkownik szuka konkretnego typu biegu powiązanego z jednym miastem.
