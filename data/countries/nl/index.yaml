  title_parts:
    category: '{category}-wedstrijden'
    race_type: '{race_type}'
    location: in {location}
    default: Alle wedstrijden
  paragraph_templates:
    category_race_location: Vind {category} {race_type}wedstrijden in {location}.
    category_race: Ontdek {category} {race_type}wedstrijden in heel Nederland.
    category_location: Ontdek {category}-wedstrijden in {location}.
    race_location: Bekijk alle {race_type}wedstrijden in {location}.
    category_only: Vind {category}-wedstrijden in heel Nederland.
    race_only: Ontdek {race_type}wedstrijden in alle provincies.
    location_only: Bekijk alle soorten wedstrijden in {location}.
    default_suffix: Hier vind je data, afstanden en alle informatie die je nodig hebt om je volgende wedstrijd te plannen.
  browse_page_templates:
    county:
      title: '{label} wedstrijden | {site_name}'
      meta_description: Bekijk hardloopwedstrijden in {label}. Vergelijk data, afstanden, loopvormen en praktische details voordat je je volgende wedstrijd kiest.
      h1: Wedstrijden in {label}
      paragraph: Deze pagina verzamelt hardloopwedstrijden in {label}, zodat je data, afstanden, loopvormen en praktische details op één plek kunt vergelijken. Gebruik hem als je een duidelijker overzicht wilt voordat je je volgende wedstrijd kiest.
    city:
      title: '{label} wedstrijden | {site_name}'
      meta_description: Vind hardloopwedstrijden rond {label}. Vergelijk data, afstanden, nabije opties en praktische details voordat je je volgende wedstrijd kiest.
      h1: Wedstrijden bij {label}
      paragraph: Deze stedenpagina helpt je hardloopwedstrijden rond {label} te bekijken, inclusief nabije alternatieven die relevant zijn als je een wedstrijddag of een uitstap plant. Zo vergelijk je lokale wedstrijden sneller.
    month:
      title: '{label} wedstrijden | {site_name}'
      meta_description: Bekijk hardloopwedstrijden in {label} in {market}. Vergelijk data, afstanden, looptypes en praktische details voordat je je seizoen plant.
      h1: Wedstrijden in {label}
      paragraph: Deze pagina is voor hardlopers die de kalender per maand willen zien en sneller willen vergelijken wat er in {label} gebeurt. Zo beperk je de keuze voordat je verder filtert op afstand, ondergrond en locatie.
    race_type:
      title: '{label}-wedstrijden in {market} | {site_name}'
      meta_description: Bekijk {label_lower}-wedstrijden in {market}. Vergelijk data, afstanden, locaties en praktische details voordat je een wedstrijd kiest die bij je past.
      h1: '{label}-wedstrijden in {market}'
      paragraph: Deze pagina richt zich op {label_lower}-wedstrijden en geeft een duidelijker overzicht wanneer het looptype even belangrijk is als de afstand. Gebruik hem om opties in provincies, data en praktische details te vergelijken.
    category:
      title: '{label}-wedstrijden in {market} | {site_name}'
      meta_description: Bekijk {label}-wedstrijden in {market}. Vergelijk data, looptypes, locaties en praktische details voordat je je volgende wedstrijd kiest.
      h1: '{label}-wedstrijden in {market}'
      paragraph: Deze afstand- en categoriepagina verzamelt wedstrijden die bij {label} passen, zodat je relevante opties op één plek vergelijkt. Hij is bedoeld voor lopers die sneller van een breed overzicht naar een korte lijst willen.
    race_type_category:
      title: '{label} {secondary_label}-wedstrijden in {market} | {site_name}'
      meta_description: Bekijk {label}-wedstrijden in {market} binnen het looptype {secondary_label_lower}. Vergelijk data, locaties en praktische details voordat je je volgende wedstrijd kiest.
      h1: '{label}-wedstrijden in {market} ({secondary_label})'
      paragraph: Deze pagina beperkt de kalender tot {label}-wedstrijden binnen het looptype {secondary_label_lower}, wat handig is als zowel afstand als loopvorm de keuze bepalen. Gebruik hem om vergelijkbare opties te bekijken voordat je je inschrijft.
    race_type_county:
      title: '{secondary_label}-wedstrijden in {label} | {site_name}'
      meta_description: Bekijk {secondary_label_lower}-wedstrijden in {label}. Vergelijk data, afstanden en praktische details voordat je je volgende wedstrijd kiest.
      h1: '{secondary_label}-wedstrijden in {label}'
      paragraph: Deze pagina richt zich op {secondary_label_lower}-wedstrijden in {label}, zodat je relevantere opties in dezelfde provincie vergelijkt. Handig wanneer zowel de regio als het looptype je shortlist bepalen.
    race_type_month:
      title: '{secondary_label}-wedstrijden in {label} | {site_name}'
      meta_description: Bekijk {secondary_label_lower}-wedstrijden in {label_lower}. Vergelijk data, afstanden en praktische details terwijl je je seizoen plant.
      h1: '{secondary_label}-wedstrijden in {label}'
      paragraph: Deze pagina verzamelt {secondary_label_lower}-wedstrijden in {label_lower} voor lopers die eerst op de kalender plannen. Zo vergelijk je vergelijkbare loopvormen voordat je verder filtert op plaats of afstand.
    race_type_city:
      title: '{secondary_label}-wedstrijden bij {label} | {site_name}'
      meta_description: Bekijk {secondary_label_lower}-wedstrijden rond {label}. Vergelijk data, afstanden en nabije opties voordat je je volgende wedstrijd kiest.
      h1: '{secondary_label}-wedstrijden bij {label}'
      paragraph: Deze pagina verzamelt {secondary_label_lower}-wedstrijden rond {label}, zodat lokale wedstrijden sneller te vergelijken zijn. Handig als je een bepaald looptype bij één stad wilt zonder de hele kalender te openen.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Je schrijft tijdloze SEO-teksten voor indexeerbare hardloopkalender-pagina''s. Schrijf eerst voor mensen, daarna voor zoekintentie. Geef alleen geldige JSON. Houd de tekst tijdloos: noem nooit een huidig jaar, aantallen, tijdelijke claims of versheid. Vermijd keyword stuffing, hype, clickbait, superlatieven en niet-verifieerbare claims. Maak elke pagina duidelijk onderscheidend op basis van de routecontext. Gebruik natuurlijk Nederlands dat past bij een hardloopkalender in Nederland. Kies beknopte titels en H1''s, metabeschrijvingen van ongeveer 120-160 tekens en een alinea van 2-3 korte zinnen.'
  browse_guidance:
    county: De gebruiker wil wedstrijden in één provincie.
    city: De gebruiker wil wedstrijden rond een stad of een stad in de buurt.
    month: De gebruiker wil wedstrijden per maand.
    race_type: De gebruiker wil een bepaald looptype.
    category: De gebruiker wil een bepaalde afstand of wedstrijdcategorie.
    race_type_category: De gebruiker wil een bepaalde afstand/categorie binnen één looptype.
    race_type_county: De gebruiker wil een bepaald looptype in één provincie.
    race_type_month: De gebruiker wil een bepaald looptype in één maand.
    race_type_city: De gebruiker wil een bepaald looptype rond één stad.
