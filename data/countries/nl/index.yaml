about_us:
  title: Over Hardlooplijst
  meta_description: Hardlooplijst – jouw gids voor hardlopen in Nederland
  content:
    intro: Welkom bij Hardlooplijst – het meest complete platform voor hardlopers in Nederland!
    mission: Onze missie is om het makkelijk te maken voor hardlopers om informatie over wedstrijden, training en alles rond hardlopen te vinden en te delen.
    story: Hardlooplijst is in 2023 gestart door hardlopers voor hardlopers. We zagen behoefte aan een modern, gebruiksvriendelijk platform waar de hardloopcommunity samenkomt.
    features:
    - title: Complete wedstrijdlijst
      description: We verzamelen alle wedstrijden in Nederland op één plek – van kleine lokale loops tot grote internationale evenementen.
    - title: Gedreven door de community
      description: Ons platform wordt gedreven door hardlopers zoals jij. Iedereen kan informatie over wedstrijden toevoegen en meedoen in het gesprek.
    - title: Gratis tools
      description: We bieden nuttige tools zoals tempo-omrekenaars, trainingsprogramma's en routeplanning – helemaal gratis.
    closing: We blijven het platform ontwikkelen op basis van feedback van gebruikers. Heb je verbeterideeën? Neem gerust contact met ons op!
contact:
  title: Neem contact met ons op
  meta_description: Neem contact op met Hardlooplijst – we helpen je graag
  content:
    intro: 'We horen graag van je! Zo kun je contact met ons opnemen:'
    email:
      title: E-mail
      address: loppkartan@gmail.com
      description: Op werkdagen reageren we meestal binnen 24 uur.
    social:
      title: Sociale media
      description: 'Volg ons op sociale media voor het laatste nieuws en updates:'
    feedback:
      title: Feedback
      description: We waarderen alle feedback die Hardlooplijst beter maakt.
privacy_page:
  title: Privacybeleid
  meta_description: Privacybeleid en informatie over hoe Hardlooplijst persoonsgegevens en cookies verwerkt.
  last_updated_label: Laatst bijgewerkt
  last_updated_date: 27 maart 2026
  contact_intro: 'Voor vragen en verzoeken over privacy kun je contact met ons opnemen via:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Gegevens die we verzamelen
    intro: 'We verzamelen gegevens die je rechtstreeks aan ons geeft wanneer je:'
    bullets:
    - Een account aanmaakt
    - Wedstrijdinformatie instuurt
    - In het forum schrijft
    - Contact met ons opneemt
  - title: 2. Cookies en tracking
    intro: 'We gebruiken cookies om:'
    bullets:
    - Je instellingen te onthouden
    - Je sessie en inlogstatus te bewaren
    - Verkeer en gebruik van de site te analyseren
    - Relevante advertenties te tonen en de ervaring te verbeteren
  - title: 3. Hoe we je gegevens gebruiken
    intro: 'Je gegevens helpen ons om:'
    bullets:
    - Onze diensten te leveren en te verbeteren
    - Belangrijke berichten en updates te sturen
    - Op vragen en support te reageren
    - Fraude en misbruik te voorkomen
  - title: 4. Jouw rechten
    intro: 'Volgens de AVG heb je het recht om:'
    bullets:
    - Toegang tot je persoonsgegevens te krijgen
    - Onjuiste of onvolledige gegevens te laten corrigeren
    - Verwijdering van je gegevens te vragen
    - Bezwaar te maken tegen bepaalde verwerkingen
    - Gegevensoverdraagbaarheid te vragen
  - title: 5. Neem contact met ons op
    intro: Heb je vragen over hoe we persoonsgegevens verwerken of cookies gebruiken, neem dan gerust contact met ons op.
