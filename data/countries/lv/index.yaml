privacy_page:
  title: Privātuma politika
  meta_description: Privātuma politika un informācija par to, kā Skrējienu kalendārs apstrādā personas datus un sīkdatnes.
  last_updated_label: Pēdējoreiz atjaunots
  last_updated_date: 2026. gada 16. novembris
  contact_intro: 'Privātuma jautājumos un pieprasījumos, lūdzu, sazinies ar mums:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Informācija, ko mēs vācam
    intro: 'Mēs vācam informāciju, ko tu mums tieši sniedz, kad tu:'
    bullets:
