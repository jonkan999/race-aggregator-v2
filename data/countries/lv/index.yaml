    category_race: 'Izpēti skrējienus visā Latvijā (kategorija: {category}, veids: {race_type}).'
    category_location: 'Atrodi skrējienus kategorijā {category}. Vieta: {location}.'
    race_location: 'Skati visus skrējienus (veids: {race_type}). Vieta: {location}.'
    category_only: Atrodi skrējienus kategorijā {category} visā Latvijā.
    race_only: 'Izpēti skrējienus (veids: {race_type}) visos Latvijas novados.'
    location_only: 'Skati visu veidu skrējienus. Vieta: {location}.'
    default_suffix: Šeit atradīsi datumus, distances un visu nepieciešamo informāciju, lai plānotu nākamo skrējienu.
  browse_page_templates:
    county:
      title: 'Skrējieni: {label} | {site_name}'
      meta_description: 'Skrējieni: {label}. Salīdzini datumus, distances, formātus un praktiskās detaļas, pirms izvēlies nākamo skrējienu.'
      h1: 'Skrējieni: {label}'
      paragraph: 'Šajā lapā apkopoti skrējieni, kas notiek šeit: {label}. Salīdzini datumus, distances, formātus un praktiskās detaļas vienuviet un saplāno nākamo skrējienu.'
    city:
      title: 'Skrējieni: {label} un apkārtne | {site_name}'
      meta_description: 'Skrējieni: {label} un apkārtne. Salīdzini datumus, distances un tuvākās iespējas, pirms izvēlies nākamo skrējienu.'
      h1: 'Skrējieni: {label} un apkārtne'
      paragraph: Šī pilsētas lapa palīdz atrast skrējienus, kas saistīti ar pilsētu {label}, kā arī tuvumā esošas alternatīvas, kas noder, plānojot sacensību dienu vai braucienu.
    month:
      title: 'Skrējieni: {label} | {site_name}'
      meta_description: 'Skrējieni Latvijā, mēnesis: {label}. Salīdzini datumus, distances, skrējienu veidus un praktiskās detaļas, plānojot sezonu.'
      h1: 'Skrējieni: {label}'
      paragraph: Šī lapa domāta skrējējiem, kuri plāno pa mēnešiem. Tā palīdz ātri salīdzināt šī mēneša skrējienus, pirms iedziļinies distancēs, segumos un norises vietās.
    race_type:
      title: '{label}: skrējieni Latvijā | {site_name}'
      meta_description: 'Skrējieni Latvijā, veids: {label_lower}. Salīdzini datumus, distances, vietas un praktiskās detaļas, pirms izvēlies sev piemērotāko.'
      h1: '{label}: skrējieni Latvijā'
      paragraph: Šī lapa apkopo vienu skrējienu veidu, kad formāts ir tikpat svarīgs kā distance. Salīdzini iespējas pa novadiem, datumiem un praktiskajām detaļām, nesākot no pilnā kalendāra.
    category:
      title: '{label}: skrējieni Latvijā | {site_name}'
      meta_description: 'Skrējieni Latvijā, distance: {label}. Salīdzini datumus, skrējienu veidus, vietas un praktiskās detaļas, pirms izvēlies nākamo startu.'
      h1: '{label}: skrējieni Latvijā'
      paragraph: Šī distances lapa apkopo skrējienus, kas atbilst kategorijai {label}, lai piemērotās iespējas varētu salīdzināt vienuviet. Tā palīdz ātrāk tikt no plaša saraksta līdz dažiem reāliem variantiem.
    race_type_category:
      title: '{label}, {secondary_label}: skrējieni Latvijā | {site_name}'
      meta_description: 'Skrējieni Latvijā: {label}, veids: {secondary_label_lower}. Salīdzini datumus, vietas un praktiskās detaļas, pirms izvēlies nākamo startu.'
      h1: '{label}, {secondary_label}: skrējieni Latvijā'
      paragraph: Šī lapa sašaurina kalendāru līdz vienai distancei un vienam skrējiena veidam. Tas noder, ja izvēli nosaka gan distance, gan formāts.
    race_type_county:
      title: '{secondary_label}: skrējieni, {label} | {site_name}'
      meta_description: 'Skrējieni ({secondary_label_lower}): {label}. Salīdzini datumus, distances un praktiskās detaļas, lai izvēlētos nākamo skrējienu.'
      h1: '{secondary_label}: skrējieni, {label}'
      paragraph: Šī lapa apkopo viena veida skrējienus vienā novadā, lai būtu vieglāk salīdzināt piemērotākās iespējas, ja izvēli nosaka gan atrašanās vieta, gan formāts.
    race_type_month:
      title: '{secondary_label}: skrējieni, {label} | {site_name}'
      meta_description: 'Skrējieni ({secondary_label_lower}), mēnesis: {label_lower}. Salīdzini datumus, distances un praktiskās detaļas, plānojot sezonu.'
      h1: '{secondary_label}: skrējieni, {label}'
      paragraph: Šī lapa apkopo viena veida skrējienus vienā mēnesī skrējējiem, kuri vispirms plāno pēc kalendāra. Tā palīdz salīdzināt līdzīgus formātus, pirms izvēlies vietu vai distanci.
    race_type_city:
      title: '{secondary_label}: skrējieni, {label} un apkārtne | {site_name}'
      meta_description: 'Skrējieni ({secondary_label_lower}): {label} un apkārtne. Salīdzini datumus, distances un tuvākās iespējas, pirms izvēlies nākamo skrējienu.'
      h1: '{secondary_label}: skrējieni, {label} un apkārtne'
      paragraph: Šī lapa apkopo viena veida skrējienus pie pilsētas {label}, lai vietējos skrējienus varētu salīdzināt ātrāk, nesākot no pilnā kalendāra.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Tu raksti nemainīgu SEO tekstu indeksējamām skrējienu pārlūkošanas lapām. Raksti vispirms cilvēkiem, pēc tam meklēšanas nolūkam. Izvadi tikai derīgu JSON. Teksts ir laika ziņā nemainīgs: nekad nepiemin pašreizējo gadu, skaitļus, ierobežota laika piedāvājumus vai svaiguma apgalvojumus. Izvairies no atslēgvārdu pārblīvējuma, pārspīlējumiem, klikšķu pievilināšanas, pārāk lieliem apgalvojumiem un neapstiprināmiem datiem. Katru lapu padari skaidri atšķirīgu, balstoties uz dotā maršruta kontekstu. Izmanto dabiski latviešu valodu, piemērotu Latvijas skrējienu kalendāram. Dod priekšroku kodolīgiem virsrakstiem, kodolīgiem H1, meta aprakstiem aptuveni 120-160 rakstzīmju garumā, ja iespējams, un 2-3 īsu teikumu rindkopai.'
  browse_guidance:
    county: User wants races in one region.
    city: User wants races connected to a city or nearby city.
