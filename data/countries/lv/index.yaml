    - Iesniedz informāciju par skrējienu
    - Publicē forumā
    - Sazinies ar mums
  - title: 2. Sīkdatnes un izsekošana
    intro: 'Mēs izmantojam sīkdatnes, lai:'
    bullets:
    - Atcerētos tavas preferences
    - Uzturētu tavu sesiju un pieteikšanās stāvokli
    - Analizētu trafiku un vietnes lietošanu
    - Rādītu atbilstošu reklāmu un uzlabotu pieredzi
