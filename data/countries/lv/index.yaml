about_us:
  title: Par Skrējienu kalendāru
  meta_description: 'Skrējienu kalendārs: tavs ceļvedis skrējieniem Latvijā'
  content:
    intro: Laipni lūgts skrejienukalendars.com, Latvijas skrējienu kalendārā.
    mission: Mūsu misija ir atvieglot skrējējiem sacensību, treniņu un visu ar skriešanu saistīto informācijas atrašanu un dalīšanos ar to.
    story: Skrejienukalendars.com veido skrējēji skrējējiem. Mēs vēlamies vienu aktuālu vietu, kur Latvijas skriešanas kopiena var atrast nākamo skrējienu.
    features:
    - title: Pilns skrējienu saraksts
      description: Mēs apkopojam Latvijas skrējienus vienuviet, no maziem vietējiem pasākumiem līdz lielām starptautiskām sacensībām.
    - title: Kopienas veidota
      description: Platformu veido skrējēji kā tu. Ikviens var pievienot informāciju par skrējieniem un iesaistīties diskusijā.
    - title: Bezmaksas rīki
      description: Piedāvājam tempu kalkulatoru, treniņu plānus un distanču mērīšanu, viss pilnīgi bez maksas.
    closing: Mēs pastāvīgi uzlabojam platformu, balstoties uz lietotāju atsauksmēm. Ir ierosinājums? Sazinies ar mums!
contact:
  title: Sazinies ar mums
  meta_description: Sazinies ar skrejienukalendars.com. Mēs esam šeit, lai palīdzētu
  content:
