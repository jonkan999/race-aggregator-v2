about_us:
  title: За Календара на бяганията в България
  meta_description: Календар на бяганията в България - вашият ориентир за бягане в България
  content:
    intro: Добре дошли в Календара на бяганията в България - практична платформа за бегачи в цялата страна.
    mission: Нашата цел е да улесним бегачите в намирането и споделянето на информация за състезания, тренировки и всичко свързано с бягането.
    story: Календарът на бяганията в България се развива от нуждата за модерно и полезно място, където местната бегаческа общност да намира състезания на едно място.
    features:
    - title: Пълен списък със състезания
      description: Събираме състезания от цяла България на едно място - от по-малки локални стартове до големи международни събития.
    - title: Общностен подход
      description: Платформата се развива заедно с бегачите. Всеки може да допринася с информация за състезания и да участва в дискусии.
    - title: Безплатни инструменти
      description: Предлагаме полезни инструменти като калкулатор на темпо, тренировъчни планове и измерване на маршрути - напълно безплатно.
    closing: Продължаваме да развиваме платформата според обратната връзка от потребителите. Ако имате идеи за подобрения, ще се радваме да ни пишете.
