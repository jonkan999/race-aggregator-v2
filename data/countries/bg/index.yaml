seo_templates:
  title_parts:
    category: '{category} състезания'
    race_type: '{race_type}'
    location: в {location}
    default: Всички състезания
  paragraph_templates:
    category_race_location: Намерете {category} {race_type} състезания в {location}.
    category_race: Разгледайте {category} {race_type} състезания в цяла България.
    category_location: Открийте {category} състезания в {location}.
    race_location: Вижте всички {race_type} състезания в {location}.
    category_only: Намерете {category} състезания в цяла България.
    race_only: Разгледайте {race_type} състезания във всички области.
    location_only: Вижте всички типове състезания в {location}.
    default_suffix: Тук ще намерите дати, дистанции и практична информация за планирането на следващото си състезание.
  browse_page_templates:
    county:
      title: '{label} състезания | {site_name}'
      meta_description: Разгледайте състезания по бягане в {label}. Сравнете дати, дистанции, формат и практична информация, преди да изберете следващото си състезание.
      h1: Състезания в {label}
      paragraph: Тази страница събира състезанията по бягане в {label}, за да можете по-лесно да сравнявате дати, дистанции, формат и практична информация на едно място. Подходяща е, когато искате по-ясна картина, преди да решите кое да е следващото ви състезание.
    city:
      title: '{label} състезания | {site_name}'
      meta_description: Намерете състезания по бягане, свързани с {label}. Сравнете дати, дистанции, близки алтернативи и практична информация, преди да изберете следващото си състезание.
      h1: Състезания около {label}
      paragraph: Тази градска страница ви помага да разглеждате състезания по бягане, свързани с {label}, включително близки алтернативи, които имат смисъл при планиране на старт или пътуване. Създадена е, за да прави местното търсене на състезания по-бързо и по-лесно за сравнение.
    month:
      title: '{label} състезания | {site_name}'
      meta_description: Разгледайте състезания по бягане в {label_lower} в {market}. Сравнете дати, дистанции, типове състезания и практична информация, когато планирате сезона си.
      h1: Състезания през {label}
      paragraph: Тази страница е за бегачи, които искат да виждат календара месец по месец и по-бързо да сравняват какво се случва през {label_lower}. Помага да стесните избора, преди да навлезете в детайлите за дистанции, настилки и локации.
    race_type:
      title: '{label} състезания в {market} | {site_name}'
      meta_description: Разгледайте {label_lower} състезания в {market}. Сравнете дати, дистанции, локации и практична информация, преди да изберете старт, който ви подхожда.
      h1: '{label} състезания в {market}'
      paragraph: Тази страница е фокусирана върху {label_lower} състезанията и дава по-ясна представа, когато форматът на състезанието е също толкова важен, колкото и дистанцията. Полезна е за сравнение между области, дати и практически детайли, без да започвате от целия календар.
    category:
      title: '{label} състезания в {market} | {site_name}'
      meta_description: Разгледайте {label} състезания в {market}. Сравнете дати, типове състезания, локации и практична информация, преди да изберете следващото си събитие.
      h1: '{label} състезания в {market}'
      paragraph: Тази страница по дистанция и категория събира състезания, които отговарят на {label}, за да е по-лесно да сравнявате подходящите възможности на едно място. Създадена е за бегачи, които искат по-бърз преход от общо разглеждане към реалистичен кратък списък.
    race_type_category:
      title: '{label} {secondary_label} състезания в {market} | {site_name}'
      meta_description: Разгледайте {label} състезания в {market} в рамките на типа {secondary_label_lower}. Сравнете дати, локации и практична информация, преди да изберете следващия си старт.
      h1: '{label} състезания в {market} ({secondary_label})'
      paragraph: Тази страница стеснява календара до {label} състезания в рамките на типа {secondary_label_lower}, което е полезно, когато и дистанцията, и форматът имат значение за избора. Така можете по-лесно да сравните сходни възможности, преди да вземете решение.
    race_type_county:
      title: '{secondary_label} състезания в {label} | {site_name}'
      meta_description: Разгледайте {secondary_label_lower} състезания в {label}. Сравнете дати, дистанции и практична информация, преди да изберете следващото си състезание.
      h1: '{secondary_label} състезания в {label}'
      paragraph: Тази страница е насочена към {secondary_label_lower} състезанията в {label}, за да улесни сравняването на по-подходящи варианти в рамките на една и съща област. Полезна е, когато и географията, и форматът влияят върху избора.
    race_type_month:
      title: '{secondary_label} състезания през {label} | {site_name}'
      meta_description: Разгледайте {secondary_label_lower} състезания в {label_lower}. Сравнете дати, дистанции и практична информация, докато планирате сезона си.
      h1: '{secondary_label} състезания през {label}'
      paragraph: Тази страница събира {secondary_label_lower} състезания през {label_lower} за бегачи, които планират първо по календара. Помага да сравните сходни формати, преди да стесните избора по място или дистанция.
    race_type_city:
      title: '{secondary_label} състезания около {label} | {site_name}'
