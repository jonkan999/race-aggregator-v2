about_us:
  title: Jooksma
  meta_description: Jooksma - Teie giid jooksmiseks Eestis
  content:
    intro: Tere tulemast Jooksma - Eesti kõige täielikum platvorm jooksjatele!
    mission: Meie missioon on muuta jooksjatele lihtsaks leida ja jagada teavet võistluste, treeningute ja kõigi jooksuga seotud asjade kohta.
    story: Jooksma.ee alustas 2023 jooksjate poolt jooksjatele. Me nägime vajadust kaasaegse ja kasutajasõbraliku platvormi järele, kus Eesti jooksjate kogukond saaks kokku tulla.
    features:
    - title: Täielik Jooksu Nimekiri
      description: Kogume kõik Eesti jooksud ühte kohta - alates väikestest kohalikest jooksudest kuni suurte rahvusvaheliste üritusteni.
    - title: Kogukonnapõhine
      description: Meie platvormi juhivad jooksjad nagu sina. Igaüks saab anda panuse teabe jagamisse ürituste kohta ja osaleda aruteludes.
    - title: Tasuta Tööriistad
      description: Pakume kasulikke tööriistu, nagu kiirus kalkulaatorid, treeningprogrammid ja marsruudi planeerimine - täiesti tasuta.
    closing: Jätkame platvormi arendamist, tuginedes meie kasutajate tagasisidele. Kas sul on ettepanekuid paranduste osas? Võta meiega ühendust!
contact:
  title: Kontaktige meid
  meta_description: Võta ühendust Jooksma.ee - Me oleme siin, et sind aidata
  content:
    intro: 'Me tahame sinust kuulda! Siin on erinevad viisid meiega ühendust võtta:'
    email:
      title: E-kiri
      address: loppkartan@gmail.com
      description: Me vastame tavaliselt 24 tunni jooksul tööpäevadel.
    social:
      title: Sotsiaalmeedia
      description: 'Jälgi meid sotsiaalmeedias, et saada uusimaid uudiseid ja uuendusi:'
    feedback:
      title: Tagasiside
      description: Aitame meeleldi kõik tagasiside, mis aitab meil Jooksma.ee parandada.
privacy_page:
  title: Privaatsuspoliitika
  meta_description: Privaatsuspoliitika ja teave selle kohta, kuidas Jooksma käsitleb isikuandmeid ning küpsiseid.
  last_updated_label: Viimati uuendatud
  last_updated_date: 27. märts 2026
  contact_intro: 'Privaatsusega seotud küsimuste ja taotluste korral võta meiega ühendust:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Millist teavet me kogume
    intro: 'Kogume teavet, mida annad meile otse, kui:'
    bullets:
    - lood konto
    - esitad võistluse andmeid
    - postitad foorumisse
    - võtad meiega ühendust
  - title: 2. Küpsised ja jälgimine
    intro: 'Kasutame küpsiseid selleks, et:'
    bullets:
    - meeles pidada sinu eelistusi
    - säilitada sinu seanssi ja sisselogitud olekut
    - analüüsida liiklust ja saidi kasutust
    - näidata asjakohast reklaami ja parandada kasutuskogemust
  - title: 3. Kuidas me sinu teavet kasutame
    intro: 'Sinu teave aitab meil:'
    bullets:
    - pakkuda ja parandada oma teenuseid
    - saata olulisi teavitusi ja uuendusi
    - vastata päringutele ja tugiküsimustele
    - ennetada pettust ja kuritarvitusi
  - title: 4. Sinu õigused
    intro: 'GDPR-i alusel on sul õigus:'
    bullets:
    - pääseda ligi oma isikuandmetele
    - parandada ebatäpseid või puudulikke andmeid
    - taotleda oma andmete kustutamist
    - vaidlustada teatud töötlemistoiminguid
    - taotleda andmete ülekandmist
  - title: 5. Võta meiega ühendust
    intro: Kui sul on küsimusi selle kohta, kuidas me isikuandmeid töötleme või küpsiseid kasutame, oled alati teretulnud meiega ühendust võtma.
