    default_suffix: Siit leiad kuupäevad, distantsid ja praktilise info järgmise võistluse valimiseks.
  browse_page_templates:
    county:
      title: '{label} jooksud | {site_name}'
      meta_description: Sirvi piirkonna {label} jooksuvõistlusi. Võrdle kuupäevi, distantse, formaate ja praktilist infot enne järgmise võistluse valimist.
      h1: Jooksud piirkonnas {label}
      paragraph: See leht koondab piirkonna {label} jooksud ühte kohta, et saaksid kuupäevi, distantse, võistluse formaati ja praktilist infot hõlpsamalt võrrelda.
    city:
      title: '{label} jooksud | {site_name}'
      meta_description: Leia linnaga {label} seotud jooksud. Võrdle kuupäevi, distantse, lähedalasuvaid valikuid ja praktilist infot enne otsuse tegemist.
      h1: Jooksud linna {label} lähedal
      paragraph: See linnaleht aitab sirvida linnaga {label} seotud jookse, sealhulgas lähedasi alternatiive, mis on olulised võistluspäeva või reisi planeerimisel.
    month:
      title: '{label} jooksud | {site_name}'
      meta_description: Sirvi kuu {label} jooksuvõistlusi turul {market}. Võrdle kuupäevi, distantse, tüüpe ja praktilist infot enne hooaja planeerimist.
      h1: Jooksud kuus {label}
      paragraph: See leht on mõeldud jooksjatele, kes tahavad kalendrit kuude kaupa vaadata ja kiiremini võrrelda, mis toimub kuus {label}.
    race_type:
      title: '{label} jooksud turul {market} | {site_name}'
      meta_description: Sirvi tüübi {label_lower} jookse turul {market}. Võrdle kuupäevi, distantse, asukohti ja praktilist infot enne valiku tegemist.
      h1: '{label} jooksud turul {market}'
      paragraph: See leht keskendub tüübi {label_lower} jooksudele ja annab selgema ülevaate siis, kui võistluse formaat on sama oluline kui distants.
    category:
      title: '{label} jooksud turul {market} | {site_name}'
      meta_description: Sirvi kategooria {label} jookse turul {market}. Võrdle kuupäevi, tüüpe, asukohti ja praktilist infot enne järgmise võistluse valimist.
      h1: '{label} jooksud turul {market}'
      paragraph: See distantsi- ja kategoorialeht toob kokku võistlused, mis vastavad kategooriale {label}, et asjakohaseid valikuid oleks lihtsam võrrelda.
    race_type_category:
      title: '{label} {secondary_label} jooksud turul {market} | {site_name}'
      meta_description: Sirvi kategooria {label} jookse turul {market} võistlustüübis {secondary_label_lower}. Võrdle kuupäevi, asukohti ja praktilist infot.
      h1: '{label} jooksud turul {market} ({secondary_label})'
      paragraph: See leht kitsendab kalendri kategooria {label} jooksudele tüübis {secondary_label_lower}, mis aitab siis, kui nii distants kui formaat mõjutavad valikut.
    race_type_county:
      title: '{secondary_label} jooksud piirkonnas {label} | {site_name}'
      meta_description: Sirvi tüübi {secondary_label_lower} jookse piirkonnas {label}. Võrdle kuupäevi, distantse ja praktilist infot enne järgmise võistluse valimist.
      h1: '{secondary_label} jooksud piirkonnas {label}'
      paragraph: See leht keskendub tüübi {secondary_label_lower} jooksudele piirkonnas {label}, et sama piirkonna sees oleks asjakohasemaid valikuid lihtsam võrrelda.
    race_type_month:
      title: '{secondary_label} jooksud kuus {label} | {site_name}'
      meta_description: Sirvi tüübi {secondary_label_lower} jookse kuus {label_lower}. Võrdle kuupäevi, distantse ja praktilist infot hooaja planeerimisel.
      h1: '{secondary_label} jooksud kuus {label}'
      paragraph: See leht koondab tüübi {secondary_label_lower} jooksud kuus {label_lower} nende jaoks, kes planeerivad eelkõige kalendri järgi.
    race_type_city:
      title: '{secondary_label} jooksud linna {label} lähedal | {site_name}'
      meta_description: Sirvi tüübi {secondary_label_lower} jookse, mis on seotud linnaga {label}. Võrdle kuupäevi, distantse ja lähedalasuvaid valikuid.
      h1: '{secondary_label} jooksud linna {label} lähedal'
      paragraph: See leht koondab tüübi {secondary_label_lower} jooksud, mis on seotud linnaga {label}, et kohalikku valikut oleks kiirem võrrelda.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Kirjutad indekseeritavatele jooksuvõistluste sirvimislehtedele ajatut SEO-teksti. Kirjuta eelkõige inimestele, alles seejärel otsingu eesmärki silmas pidades. Väljasta ainult korrektne JSON. Hoia tekst ajatu: ära maini käesolevat aastat, jooksvaid loendureid, piiratud aja sõnastust ega värskusväiteid. Väldi märksõnade kuhjamist, hüperbooli, klikipeibutust, superlatiive ja kontrollimatuid väiteid. Tee iga leht antud marsruudikonteksti põhjal selgelt eristatavaks. Kasuta loomulikku eesti keelt, mis sobib Eesti jooksukalendrile. Eelista lühikesi pealkirju, lühikesi H1-sid, võimalusel 120-160 märgi pikkuseid metakirjeldusi ja 2-3 lühikesest lausest koosnevat lõiku.'
  browse_guidance:
    county: User wants races in one region.
    city: User wants races connected to a city or nearby city.
    month: User wants races by month.
    race_type: User wants a specific race type.
    category: User wants a specific distance or race category.
    race_type_category: User wants a specific distance/category inside one race type.
    race_type_county: User wants a specific race type in one region.
    race_type_month: User wants a specific race type in one month.
    race_type_city: User wants a specific race type connected to one city.
