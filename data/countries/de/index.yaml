about_us:
  title: Über LaufRennen
  meta_description: LaufRennen - Dein Guide zum Laufen in Deutschland
  content:
    intro: Willkommen bei LaufRennen - die umfassendste Plattform für Läufer in Deutschland!
    mission: Unsere Mission ist es, es Läufern einfach zu machen, Informationen über Rennen, Training und alles, was mit Laufen zu tun hat, zu finden und zu teilen.
    story: LaufRennen wurde 2023 von Läufern für Läufer ins Leben gerufen. Wir sahen die Notwendigkeit einer modernen und benutzerfreundlichen Plattform, auf der die deutsche Lauf-Community sich versammeln konnte.
    features:
    - title: Komplette Lauf-Liste
      description: Wir sammeln alle deutschen Läufe an einem Ort - von kleinen lokalen Veranstaltungen bis hin zu großen internationalen Events.
    - title: Gemeinschaftsorientiert
      description: Unsere Plattform wird von Läufern wie dir betrieben. Jeder kann Informationen über Veranstaltungen beitragen und an Diskussionen teilnehmen.
    - title: Kostenlose Werkzeuge
      description: Wir bieten nützliche Werkzeuge wie Geschwindigkeitsrechner, Trainingspläne und Routenplanung - völlig kostenlos an.
    closing: Wir entwickeln die Plattform weiterhin basierend auf dem Feedback unserer Nutzer. Hast du Vorschläge zur Verbesserung? Kontaktiere uns gerne!
contact:
  title: Kontaktiere uns
  meta_description: Kontaktiere LaufRennen - Wir sind hier, um dir zu helfen
  content:
    intro: 'Wir würden gerne von dir hören! Hier sind verschiedene Möglichkeiten, uns zu erreichen:'
    email:
      title: E-Mail
      address: laufrennen@gmail.com
      description: Wir antworten normalerweise innerhalb von 24 Stunden an Werktagen.
    social:
      title: Soziale Medien
      description: 'Folge uns in den sozialen Medien für die neuesten Nachrichten und Updates:'
    feedback:
      title: Rückmeldung
      description: Wir schätzen jegliches Feedback, das uns hilft, LaufRennen zu verbessern.
privacy_page:
  title: Datenschutzerklärung
  meta_description: Informationen dazu, wie LaufRennen personenbezogene Daten und Cookies verarbeitet.
  last_updated_label: Zuletzt aktualisiert
  last_updated_date: March 27, 2026
  contact_intro: 'Bei Fragen oder Anliegen zum Datenschutz erreichst du uns unter:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Welche Daten wir erfassen
    intro: 'Wir erfassen Informationen, die du uns direkt zur Verfügung stellst, wenn du:'
    bullets:
    - ein Konto erstellst
    - Laufdaten einreichst
    - im Forum schreibst
    - uns kontaktierst
  - title: 2. Cookies und Tracking
    intro: 'Wir verwenden Cookies, um:'
    bullets:
    - deine Einstellungen zu speichern
    - deine Sitzung und deinen Login zu verwalten
    - die Nutzung der Seite besser zu verstehen
    - relevante Inhalte anzuzeigen und das Erlebnis zu verbessern
  - title: 3. Wie wir deine Daten verwenden
    intro: 'Deine Daten helfen uns dabei:'
    bullets:
    - unsere Dienste bereitzustellen und zu verbessern
    - wichtige Hinweise und Updates zu senden
    - auf Anfragen und Supportfälle zu antworten
    - Missbrauch und Betrug vorzubeugen
  - title: 4. Deine Rechte
    intro: 'Nach der DSGVO hast du das Recht:'
    bullets:
    - Auskunft über deine Daten zu erhalten
    - unrichtige oder unvollständige Daten zu korrigieren
    - die Löschung deiner Daten zu verlangen
    - bestimmten Verarbeitungen zu widersprechen
    - Datenübertragbarkeit zu verlangen
  - title: 5. Kontakt
    intro: Wenn du Fragen zur Verarbeitung personenbezogener Daten oder zur Nutzung von Cookies hast, kannst du uns jederzeit kontaktieren.
