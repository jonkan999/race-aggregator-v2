    default_suffix: Hier findest du Daten, Distanzen und alle Informationen, die du benötigst, um dein nächstes Rennen zu planen.
  browse_page_templates:
    county:
      title: '{label} races | {site_name}'
      meta_description: Browse running races in {label}. Compare dates, distances, race formats and practical details before choosing your next race.
      h1: Races in {label}
      paragraph: This landing page gathers running races in {label} so it is easier to compare dates, distances, race formats and practical details in one place. Use it when you want a clearer overview before choosing your next race.
    city:
      title: '{label} races | {site_name}'
      meta_description: Find running races linked to {label}. Compare dates, distances, nearby options and practical details before choosing your next race.
      h1: Races near {label}
      paragraph: This city page helps you browse running races connected to {label}, including nearby alternatives that are relevant when planning a race day or trip. It is built to make local race discovery faster and easier to compare.
    month:
      title: '{label} races | {site_name}'
      meta_description: Browse running races in {label} in {market}. Compare dates, distances, race types and practical details before planning your season.
      h1: Races in {label}
      paragraph: This page is for runners who want a month-based view of the calendar and need a quicker way to compare what happens in {label}. It helps you narrow the field before drilling into distances, surfaces and race locations.
    race_type:
      title: '{label} races in {market} | {site_name}'
      meta_description: Browse {label_lower} races in {market}. Compare dates, distances, locations and practical details before choosing a race that fits you.
      h1: '{label} races in {market}'
      paragraph: This page focuses on {label_lower} races and gives you a cleaner overview when the race format matters as much as the distance. Use it to compare options across regions, dates and practical details without starting from the full calendar.
    category:
      title: '{label} races in {market} | {site_name}'
      meta_description: Browse {label} races in {market}. Compare dates, race types, locations and practical details before deciding on your next event.
      h1: '{label} races in {market}'
      paragraph: This distance and category page brings together races that match {label} so it is easier to compare relevant options in one place. It is designed for runners who want a faster path from broad browsing to a shortlist of realistic races.
    race_type_category:
      title: '{label} {secondary_label} races in {market} | {site_name}'
      meta_description: Browse {label} races in {market} within the {secondary_label_lower} race type. Compare dates, locations and practical details before choosing your next event.
      h1: '{label} races in {market} ({secondary_label})'
      paragraph: This page narrows the calendar to {label} races within the {secondary_label_lower} race type, which is helpful when both distance and race format shape the right choice. Use it to compare like-for-like options before committing to a race.
    race_type_county:
      title: '{secondary_label} races in {label} | {site_name}'
      meta_description: Browse {secondary_label_lower} races in {label}. Compare dates, distances and practical details before choosing your next race.
      h1: '{secondary_label} races in {label}'
      paragraph: This page focuses on {secondary_label_lower} races in {label} so it is easier to compare more relevant options within the same region. It is useful when both geography and race format shape the shortlist.
    race_type_month:
      title: '{secondary_label} races in {label} | {site_name}'
      meta_description: Browse {secondary_label_lower} races in {label_lower}. Compare dates, distances and practical details while planning your season.
      h1: '{secondary_label} races in {label}'
      paragraph: This page gathers {secondary_label_lower} races in {label_lower} for runners who plan around the calendar first. It helps you compare similar race formats before narrowing further by place or distance.
    race_type_city:
      title: '{secondary_label} races near {label} | {site_name}'
      meta_description: Browse {secondary_label_lower} races linked to {label}. Compare dates, distances and nearby options before choosing your next race.
      h1: '{secondary_label} races near {label}'
      paragraph: This page gathers {secondary_label_lower} races connected to {label} to make local race discovery faster to compare. It is useful when you want a specific race format near one city without starting from the full calendar.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Du schreibst zeitlose SEO-Texte für indexierbare Übersichtsseiten eines deutschen Laufkalenders. Schreibe zuerst für Menschen, danach für Suchintention. Gib nur gültiges JSON aus. Halte die Texte zeitlos: nenne kein aktuelles Jahr, keine aktuellen Mengen, keine kurzfristigen Aussagen und keine Frischeversprechen. Vermeide Keyword-Stuffing, Übertreibungen, Clickbait, Superlative und unbelegte Behauptungen. Jede Seite soll sich klar aus ihrem Kontext ergeben. Bevorzuge kurze Titel, prägnante H1s, Meta-Beschreibungen mit ungefähr 120 bis 160 Zeichen und einen kurzen Absatz mit zwei bis drei Sätzen.'
  browse_guidance:
    county: User wants races in one region.
    city: User wants races connected to a city or nearby city.
    month: User wants races by month.
    race_type: User wants a specific race type.
    category: User wants a specific distance or race category.
    race_type_category: User wants a specific distance/category inside one race type.
    race_type_county: User wants a specific race type in one region.
    race_type_month: User wants a specific race type in one month.
    race_type_city: User wants a specific race type connected to one city.
