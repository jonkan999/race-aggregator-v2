  title_parts:
    category: '{category} Läufe'
    race_type: '{Rennart}'
    location: in {location}
    default: Alle Rennen
  paragraph_templates:
    category_race_location: Finde {category} {race_type} Rennen in {location}.
    category_race: Erkunde {category} {race_type} Rennen in ganz Deutschland.
    category_location: Entdecke {category} Rennen in {location}.
    race_location: Sehen Sie sich alle {race_type}rennen in {location} an.
    category_only: Finde {category} Wettkämpfe in ganz Deutschland.
    race_only: Erkunde {race_type}rennen in allen Regionen.
    location_only: Se alle Arten von Rennen in {location}.
    default_suffix: Hier findest du Daten, Distanzen und alle Informationen, die du benötigst, um dein nächstes Rennen zu planen.
  browse_page_templates:
    county:
      title: Laufveranstaltungen in {label} | {site_name}
      meta_description: Alle Laufveranstaltungen in {label} im Überblick. Vergleiche Termine, Distanzen, Formate und praktische Details, bevor du deinen nächsten Lauf wählst.
      h1: Läufe in {label}
      paragraph: Auf dieser Seite findest du Laufveranstaltungen in {label} gesammelt, damit du Termine, Distanzen und Formate leichter vergleichen kannst. So behältst du den Überblick, bevor du dich für deinen nächsten Lauf entscheidest.
    city:
      title: Läufe in und um {label} | {site_name}
      meta_description: Finde Laufveranstaltungen in und um {label}. Vergleiche Termine, Distanzen, Läufe in der Nähe und praktische Details für deinen nächsten Wettkampf.
      h1: Läufe in und um {label}
      paragraph: Diese Seite zeigt Laufveranstaltungen in {label} und in der Umgebung, die für deinen nächsten Wettkampftag oder eine Laufreise interessant sein können. So findest du lokale Läufe schneller und kannst sie einfach vergleichen.
    month:
      title: Läufe im {label} | {site_name}
      meta_description: Alle Laufveranstaltungen im {label} in {market}. Vergleiche Termine, Distanzen, Laufarten und praktische Details für deine Saisonplanung.
      h1: Läufe im {label}
      paragraph: Diese Seite zeigt den Laufkalender für {label}, damit du schneller siehst, was in diesem Monat ansteht. Danach kannst du nach Distanz, Untergrund und Ort weiter eingrenzen.
    race_type:
      title: '{label} in {market} | {site_name}'
      meta_description: Alle Veranstaltungen der Kategorie {label} in {market}. Vergleiche Termine, Distanzen, Orte und praktische Details und finde den passenden Lauf.
      h1: '{label} in {market}'
      paragraph: Diese Seite konzentriert sich auf {label} und gibt dir einen klaren Überblick, wenn das Format genauso wichtig ist wie die Distanz. Vergleiche Regionen, Termine und Details, ohne den ganzen Kalender durchsuchen zu müssen.
    category:
      title: '{label} Läufe in {market} | {site_name}'
      meta_description: Alle Läufe über {label} in {market}. Vergleiche Termine, Laufarten, Orte und praktische Details, bevor du dich für deinen nächsten Wettkampf entscheidest.
      h1: '{label} Läufe in {market}'
      paragraph: Hier findest du Läufe über {label} an einem Ort, damit du passende Veranstaltungen leichter vergleichen kannst. So kommst du schneller von der groben Suche zu einer realistischen Auswahl.
    race_type_category:
      title: '{label} {secondary_label} in {market} | {site_name}'
      meta_description: Läufe über {label} in {market} in der Kategorie {secondary_label}. Vergleiche Termine, Orte und praktische Details, bevor du deinen nächsten Lauf wählst.
      h1: '{label} in {market} ({secondary_label})'
      paragraph: Diese Seite zeigt Läufe über {label} in der Kategorie {secondary_label}, hilfreich wenn Distanz und Format beide passen müssen. So vergleichst du gleichwertige Angebote, bevor du dich anmeldest.
    race_type_county:
      title: '{secondary_label} in {label} | {site_name}'
      meta_description: Alle Veranstaltungen der Kategorie {secondary_label} in {label}. Vergleiche Termine, Distanzen und praktische Details für deinen nächsten Lauf.
      h1: '{secondary_label} in {label}'
      paragraph: Diese Seite zeigt {secondary_label} in {label}, damit du passende Angebote in derselben Region leichter vergleichen kannst. Praktisch, wenn Region und Format deine Auswahl bestimmen.
    race_type_month:
      title: '{secondary_label} im {label} | {site_name}'
      meta_description: Alle Veranstaltungen der Kategorie {secondary_label} im {label}. Vergleiche Termine, Distanzen und praktische Details für deine Saisonplanung.
      h1: '{secondary_label} im {label}'
      paragraph: Hier findest du {secondary_label} im {label} für alle, die ihre Saison nach dem Kalender planen. So vergleichst du ähnliche Formate, bevor du nach Ort oder Distanz weiter eingrenzt.
    race_type_city:
      title: '{secondary_label} in und um {label} | {site_name}'
      meta_description: Veranstaltungen der Kategorie {secondary_label} in und um {label}. Vergleiche Termine, Distanzen und Läufe in der Nähe für deinen nächsten Wettkampf.
      h1: '{secondary_label} in und um {label}'
      paragraph: Diese Seite sammelt {secondary_label} in und um {label}, damit du lokale Läufe schneller vergleichen kannst. Praktisch, wenn du ein bestimmtes Format in der Nähe einer Stadt suchst.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Du schreibst zeitlose SEO-Texte für indexierbare Übersichtsseiten eines deutschen Laufkalenders. Schreibe zuerst für Menschen, danach für Suchintention. Gib nur gültiges JSON aus. Halte die Texte zeitlos: nenne kein aktuelles Jahr, keine aktuellen Mengen, keine kurzfristigen Aussagen und keine Frischeversprechen. Vermeide Keyword-Stuffing, Übertreibungen, Clickbait, Superlative und unbelegte Behauptungen. Jede Seite soll sich klar aus ihrem Kontext ergeben. Bevorzuge kurze Titel, prägnante H1s, Meta-Beschreibungen mit ungefähr 120 bis 160 Zeichen und einen kurzen Absatz mit zwei bis drei Sätzen.'
  browse_guidance:
    county: User wants races in one region.
    city: User wants races connected to a city or nearby city.
    month: User wants races by month.
    race_type: User wants a specific race type.
    category: User wants a specific distance or race category.
    race_type_category: User wants a specific distance/category inside one race type.
    race_type_county: User wants a specific race type in one region.
    race_type_month: User wants a specific race type in one month.
    race_type_city: User wants a specific race type connected to one city.
