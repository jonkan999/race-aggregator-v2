# SEO Content Templates
seo_templates:
  title_parts:
    category: '{category} løp'
    race_type: '{race_type}'
    location: 'i {location}'
    default: 'Alle løp'
  paragraph_templates:
    category_race_location: 'Finn {category} {race_type}løp i {location}.'
    category_race: 'Utforsk {category} {race_type}løp i hele Norge.'
    category_location: 'Oppdag {category} løp i {location}.'
    race_location: 'Se alle {race_type}løp i {location}.'
    category_only: 'Finn {category} løp over hele Norge.'
    race_only: 'Utforsk {race_type}løp i alle regioner.'
    location_only: 'Se alle typer løp i {location}.'
    default_suffix: 'Her finner du datoer, distanser og all informasjon du trenger for å planlegge ditt neste løp.'
  browse_page_templates:
    county:
      title: '{label} løp | {site_name}'
      meta_description: 'Bla blant løp i {label}. Sammenlign datoer, distanser, løpstyper og praktisk informasjon før du velger ditt neste løp.'
      h1: 'Løp i {label}'
      paragraph: 'Denne siden samler løp i {label} for å gjøre det enklere å sammenligne datoer, distanser, løpstyper og praktisk informasjon på ett sted. Bruk den når du vil få bedre oversikt før du velger ditt neste løp.'
    city:
      title: '{label} løp | {site_name}'
      meta_description: 'Finn løp med tilknytning til {label}. Sammenlign datoer, distanser, nærliggende alternativer og praktisk informasjon før ditt neste løp.'
      h1: 'Løp nær {label}'
      paragraph: 'Denne bysiden hjelper deg med å bla blant løp med tilknytning til {label}, inkludert nærliggende alternativer som er relevante når du planlegger løpsdag eller reise. Den er laget for å gjøre lokale løp enklere å oppdage og sammenligne.'
    month:
      title: '{label} løp | {site_name}'
      meta_description: 'Bla blant løp i {label_lower} i {market}. Sammenlign datoer, distanser, løpstyper og praktisk informasjon når du planlegger sesongen.'
      h1: 'Løp i {label}'
      paragraph: 'Denne siden er laget for løpere som vil se kalenderen måned for måned og trenger en raskere måte å sammenligne hva som skjer i {label_lower}. Den hjelper deg å snevre inn utvalget før du går videre til distanser, underlag og løpssteder.'
    race_type:
      title: 'Løp av typen {label} i {market} | {site_name}'
      meta_description: 'Bla blant løp av typen {label_lower} i {market}. Sammenlign datoer, distanser, steder og praktisk informasjon før du velger et løp som passer deg.'
      h1: 'Løp av typen {label} i {market}'
      paragraph: 'Denne siden fokuserer på løp av typen {label_lower} og gir deg en tydeligere oversikt når løpsformatet er like viktig som distansen. Bruk den for å sammenligne alternativer mellom regioner, datoer og praktiske detaljer uten å starte i hele kalenderen.'
    category:
      title: 'Løp i {market} for {label} | {site_name}'
      meta_description: 'Bla blant løp i {market} for kategorien {label}. Sammenlign datoer, løpstyper, steder og praktisk informasjon før du bestemmer deg for neste konkurranse.'
      h1: 'Løp i {market} for {label}'
      paragraph: 'Denne distanse- og kategorisiden samler løp som matcher {label} for å gjøre det enklere å sammenligne relevante alternativer på ett sted. Den er laget for løpere som vil gå raskere fra bred blaing til en kortliste med realistiske løp.'
    race_type_category:
      title: 'Løp i {market} for {label} ({secondary_label}) | {site_name}'
      meta_description: 'Bla blant løp i {market} for {label} innen løpstypen {secondary_label_lower}. Sammenlign datoer, steder og praktisk informasjon før du velger ditt neste løp.'
      h1: 'Løp i {market} for {label} ({secondary_label})'
      paragraph: 'Denne siden snevrer inn kalenderen til {label} løp innen løpstypen {secondary_label_lower}, noe som er nyttig når både distanse og løpsformat påvirker hva som passer best. Bruk den for å sammenligne mer like alternativer før du bestemmer deg for et løp.'
    race_type_county:
      title: '{secondary_label}løp i {label} | {site_name}'
      meta_description: 'Bla blant {secondary_label_lower}løp i {label}. Sammenlign datoer, distanser og praktisk informasjon før du velger ditt neste løp.'
      h1: '{secondary_label}løp i {label}'
      paragraph: 'Denne siden fokuserer på {secondary_label_lower}løp i {label} for å gjøre det lettere å sammenligne mer relevante alternativer innen samme region. Den passer når både geografi og løpsformat styrer utvalget.'
    race_type_month:
      title: '{secondary_label}løp i {label} | {site_name}'
      meta_description: 'Bla blant {secondary_label_lower}løp i {label_lower}. Sammenlign datoer, distanser og praktisk informasjon når du planlegger sesongen.'
      h1: '{secondary_label}løp i {label}'
      paragraph: 'Denne siden samler {secondary_label_lower}løp i {label_lower} for løpere som planlegger etter kalenderen først. Den hjelper deg å sammenligne lignende løpsformater før du snevrer videre inn på sted eller distanse.'
    race_type_city:
      title: '{secondary_label}løp nær {label} | {site_name}'
      meta_description: 'Bla blant {secondary_label_lower}løp med tilknytning til {label}. Sammenlign datoer, distanser og nærliggende alternativer før ditt neste løp.'
      h1: '{secondary_label}løp nær {label}'
      paragraph: 'Denne siden samler {secondary_label_lower}løp med tilknytning til {label} for å gjøre lokal løpsleting raskere å sammenligne. Den er nyttig når du vil finne riktig løpsformat nær en bestemt by uten å starte i hele kalenderen.'
seo_generation:
  browse_system_prompt: 'Du skriver tidløs SEO-tekst for indekserbare landingssider for løp. Skriv først og fremst for mennesker og deretter for søkeintensjon. Returner kun gyldig JSON. Hold teksten tidløs: nevn aldri inneværende år, aktuelle antall, begrenset tidsperiode eller formuleringer som avhenger av ferskhet. Unngå keyword stuffing, hype, klikkagn, superlativer og påstander som ikke kan verifiseres. Gjør hver side tydelig unik ut fra konteksten som sendes inn. Bruk naturlig norsk for en norsk løpskalender. Foretrekk korte titler, korte H1-er, metabeskrivelser rundt 120-160 tegn når det passer og et avsnitt på 2-3 korte setninger.'
  browse_guidance:
    county: 'Brukeren vil finne løp i en region.'
    city: 'Brukeren vil finne løp med tilknytning til en by eller nærliggende by.'
    month: 'Brukeren vil finne løp etter måned.'
    race_type: 'Brukeren vil finne en bestemt løpstype.'
    category: 'Brukeren vil finne en bestemt distanse eller kategori.'
