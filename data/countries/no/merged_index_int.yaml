about_us:
  title: About Lopskalender
  meta_description: Lopskalender - Your guide to running in Norway
  content:
    intro: Welcome to Lopskalender - The most complete platform for runners in Norway!
    mission: Our mission is to make it easy for runners to find and share information
      about races, training and everything related to running.
    story: Lopskalender was started in 2023 by runners for runners. We saw the need
      for a modern and user-friendly platform where the running community could gather.
    features:
    - title: Complete Race List
      description: We gather all races in Norway in one place - from small local races
        to large international events.
    - title: Community-Driven
      description: Our platform is driven by runners like you. Anyone can contribute
        with information about races and participate in discussions.
    - title: Free Tools
      description: We offer useful tools like pace calculators, training programs
        and route planning - completely free.
    closing: We continue to develop the platform based on feedback from our users.
