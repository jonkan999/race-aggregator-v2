seo_templates:
  title_parts:
    category: '{category} preteky'
    race_type: '{race_type}'
    location: v {location}
    default: Všetky preteky
  paragraph_templates:
    category_race_location: Nájdite {category} {race_type} preteky v {location}.
    category_race: Objavte {category} {race_type} preteky na celom Slovensku.
    category_location: Objavte {category} preteky v {location}.
    race_location: Zobraziť všetky {race_type} preteky v {location}.
    category_only: Nájdite {category} preteky na celom Slovensku.
    race_only: Objavte {race_type} preteky vo všetkých regiónoch.
    location_only: Zobraziť všetky typy pretekov v {location}.
    default_suffix: Tu nájdete dátumy, vzdialenosti a všetky informácie, ktoré potrebujete na plánovanie svojho ďalšieho preteku.
  browse_page_templates:
    county:
      title: '{label} preteky | {site_name}'
      meta_description: Prehliadajte si bežecké preteky v {label}. Porovnajte dátumy, vzdialenosti, formát pretekov a praktické informácie pred výberom svojho ďalšieho preteku.
      h1: Preteky v {label}
      paragraph: Táto stránka zhromažďuje bežecké preteky v {label}, aby bolo jednoduchšie porovnať dátumy, vzdialenosti, formát pretekov a praktické informácie na jednom mieste. Použite ju, keď chcete získať lepší prehľad pred výberom svojho ďalšieho preteku.
    city:
      title: '{label} preteky | {site_name}'
      meta_description: Nájdite bežecké preteky spojené s {label}. Porovnajte dátumy, vzdialenosti, blízke alternatívy a praktické informácie pred svojím ďalším pretekom.
      h1: Preteky v okolí {label}
      paragraph: Táto mestská stránka vám pomôže prehliadať bežecké preteky spojené s {label}, vrátane blízkych alternatív, ktoré sú relevantné pri plánovaní pretekového dňa alebo cesty. Je vytvorená tak, aby bolo lokálne objavovanie pretekov rýchlejšie a jednoduchšie na porovnanie.
    month:
      title: '{label} preteky | {site_name}'
      meta_description: Prehliadajte si bežecké preteky v {label_lower} v {market}. Porovnajte dátumy, vzdialenosti, typy pretekov a praktické informácie pri plánovaní sezóny.
      h1: Preteky v {label}
      paragraph: Táto stránka je určená pre bežcov, ktorí chcú vidieť kalendár mesiac po mesiaci a potrebujú rýchlejší spôsob porovnania toho, čo sa deje v {label_lower}. Pomáha zúžiť výber ešte predtým, než sa pustíte do vzdialeností, povrchov a miest konania.
    race_type:
      title: '{label} preteky v {market} | {site_name}'
      meta_description: Prehliadajte si {label_lower} preteky v {market}. Porovnajte dátumy, vzdialenosti, lokality a praktické informácie pred výberom preteku, ktorý vám sadne.
      h1: '{label} preteky v {market}'
      paragraph: Táto stránka sa zameriava na {label_lower} preteky a poskytuje prehľadnejší pohľad vtedy, keď je formát pretekov rovnako dôležitý ako vzdialenosť. Použite ju na porovnanie možností medzi regiónmi, dátumami a praktickými detailmi bez toho, aby ste začínali od celého kalendára.
    category:
      title: '{label} preteky v {market} | {site_name}'
      meta_description: Prehliadajte si {label} preteky v {market}. Porovnajte dátumy, typy pretekov, miesta a praktické informácie pred rozhodnutím o ďalšom štarte.
      h1: '{label} preteky v {market}'
      paragraph: Táto stránka podľa vzdialenosti a kategórie zhromažďuje preteky, ktoré zodpovedajú {label}, aby bolo jednoduchšie porovnať relevantné možnosti na jednom mieste. Je určená pre bežcov, ktorí chcú rýchlejšie prejsť od širokého prehliadania ku krátkemu zoznamu reálnych možností.
    race_type_category:
      title: '{label} preteky v {market} ({secondary_label}) | {site_name}'
      meta_description: Prehliadajte si {label} preteky v {market} v rámci typu preteku {secondary_label_lower}. Porovnajte dátumy, miesta a praktické informácie pred výberom svojho ďalšieho preteku.
      h1: '{label} preteky v {market} ({secondary_label})'
      paragraph: Táto stránka zužuje kalendár na {label} preteky v rámci typu {secondary_label_lower}, čo je užitočné vtedy, keď výber ovplyvňuje vzdialenosť aj formát preteku. Použite ju na porovnanie podobných možností pred konečným rozhodnutím.
    race_type_county:
      title: '{secondary_label} preteky v {label} | {site_name}'
      meta_description: Prehliadajte si {secondary_label_lower} preteky v {label}. Porovnajte dátumy, vzdialenosti a praktické informácie pred výberom svojho ďalšieho preteku.
      h1: '{secondary_label} preteky v {label}'
      paragraph: Táto stránka sa zameriava na {secondary_label_lower} preteky v {label}, aby bolo jednoduchšie porovnávať relevantnejšie možnosti v rámci rovnakého regiónu. Hodí sa vtedy, keď výber určujú geografia aj formát preteku.
    race_type_month:
      title: '{secondary_label} preteky v {label} | {site_name}'
      meta_description: Prehliadajte si {secondary_label_lower} preteky v {label_lower}. Porovnajte dátumy, vzdialenosti a praktické informácie pri plánovaní sezóny.
      h1: '{secondary_label} preteky v {label}'
      paragraph: Táto stránka zhromažďuje {secondary_label_lower} preteky v {label_lower} pre bežcov, ktorí plánujú najmä podľa kalendára a sezóny. Pomáha porovnať podobné formáty pretekov ešte pred zúžením podľa miesta alebo vzdialenosti.
    race_type_city:
      title: '{secondary_label} preteky v okolí {label} | {site_name}'
      meta_description: Prehliadajte si {secondary_label_lower} preteky spojené s {label}. Porovnajte dátumy, vzdialenosti a blízke alternatívy pred výberom svojho ďalšieho preteku.
      h1: '{secondary_label} preteky v okolí {label}'
      paragraph: Táto stránka zhromažďuje {secondary_label_lower} preteky spojené s {label}, aby bolo lokálne porovnávanie pretekov rýchlejšie. Hodí sa vtedy, keď hľadáte konkrétny formát preteku v blízkosti jedného mesta bez nutnosti začínať od celého kalendára.
