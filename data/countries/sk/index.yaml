seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Píšete nadčasový SEO text pre indexovateľné landing pages bežeckých pretekov. Píšte primárne pre ľudí a až sekundárne pre vyhľadávací zámer. Vráťte iba platný JSON. Text musí zostať nadčasový: nikdy nespomínajte aktuálny rok, aktuálne počty, obmedzené časové obdobie ani tvrdenia o čerstvosti. Vyhnite sa keyword stuffingu, hype štýlu, clickbaitu, superlatívom a neoveriteľným tvrdeniam. Každú stránku spravte jasne odlišnú podľa dodaného kontextu. Používajte prirodzenú slovenčinu vhodnú pre slovenský kalendár behov. Uprednostnite stručné titulky, stručné H1, meta description okolo 120-160 znakov, keď to dáva zmysel, a odsek s 2-3 krátkymi vetami.'
  browse_guidance:
    county: Používateľ chce nájsť preteky v jednom regióne.
    city: Používateľ chce nájsť preteky spojené s mestom alebo blízkym mestom.
    month: Používateľ chce nájsť preteky podľa mesiaca.
    race_type: Používateľ chce nájsť konkrétny typ preteku.
    category: Používateľ chce nájsť konkrétnu vzdialenosť alebo kategóriu preteku.
    race_type_category: Používateľ chce nájsť konkrétnu vzdialenosť alebo kategóriu v rámci jedného typu preteku.
    race_type_county: Používateľ chce nájsť konkrétny typ preteku v jednom regióne.
