  sections:
  - title: 1. Aké informácie zhromažďujeme
    intro: 'Zhromažďujeme informácie, ktoré nám priamo poskytujete, keď:'
    bullets:
    - Vytvoríte účet
    - Odošlete informácie o pretekoch
    - Uverejníte príspevok na fóre
    - Kontaktujete nás
  - title: 2. Cookies a sledovanie
    intro: 'Používame cookies na to, aby sme:'
    bullets:
    - si pamätali vaše nastavenia
    - vás udržali prihláseného a zachovali vašu reláciu
    - analyzovali návštevnosť a používanie webu
    - zobrazovali relevantné reklamy a zlepšovali obsah
  - title: 3. Ako používame vaše informácie
    intro: 'Vaše informácie nám pomáhajú:'
    bullets:
    - poskytovať a zlepšovať naše služby
    - posielať dôležité aktualizácie a oznámenia
    - odpovedať na otázky a požiadavky podpory
    - predchádzať podvodom a zneužívaniu
  - title: 4. Vaše práva
    intro: 'Podľa GDPR máte právo:'
    bullets:
    - požiadať o prístup k svojim osobným údajom
    - opraviť nesprávne alebo neúplné údaje
    - požiadať o vymazanie svojich údajov
    - namietať proti určitému spracúvaniu osobných údajov
    - požiadať o prenosnosť údajov
  - title: 5. Kontaktujte nás
    intro: Ak máte otázky o tom, ako spracúvame osobné údaje alebo používame cookies, môžete sa nám kedykoľvek ozvať.
