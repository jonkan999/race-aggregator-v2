about_us:
  title: O termínovka behov
  meta_description: Termínovka behov - váš sprievodca behom na Slovensku
  content:
    intro: Vitajte v Termínovka behov - prehľadnej platforme pre bežcov na Slovensku.
    mission: Naším cieľom je uľahčiť bežcom vyhľadávanie a zdieľanie informácií o pretekoch, tréningu a všetkom, čo súvisí s behom.
    story: Termínovka behov vznikol z potreby mať moderné a užitočné miesto, kde slovenská bežecká komunita nájde preteky na jednom mieste.
    features:
    - title: Kompletný zoznam pretekov
      description: Zhromažďujeme preteky z celého Slovenska na jednom mieste - od menších lokálnych behov až po veľké medzinárodné podujatia.
    - title: Komunita bežcov
      description: Platformu tvoria bežci pre bežcov. Každý môže prispieť informáciami o pretekoch a zapojiť sa do diskusie.
    - title: Bezplatné nástroje
      description: Ponúkame užitočné nástroje ako prevodník tempa, tréningové plány a meranie trás - úplne zadarmo.
    closing: Platformu ďalej rozvíjame na základe spätnej väzby od používateľov. Ak máte návrhy na zlepšenie, budeme radi, keď sa nám ozvete.
contact:
  title: Kontakt
  meta_description: Kontaktujte Termínovka behov - sme tu, aby sme vám pomohli
  content:
    intro: 'Radi sa vám ozveme! Tu sú rôzne spôsoby, ako nás kontaktovať:'
    email:
