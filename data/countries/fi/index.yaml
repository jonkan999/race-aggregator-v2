seo_templates:
  title_parts:
    category: '{category} juoksukilpailu'
    race_type: '{race_type}'
    location: '{location}'
    default: Kaikki juoksukilpailut
  paragraph_templates:
    category_race_location: Löydä {category} {race_type}kilpailu {location}.
    category_race: Tutki {category} {race_type}kilpailuja ympäri Suomea.
    category_location: Tutustu {category} kilpailuihin {location}.
    race_location: Löydä {race_type}kilpailuja paikkakunnalta {location}.
    category_only: Löydä {category} juoksukilpailut ympäri Suomea.
    race_only: Tutki {race_type}kilpailuja kaikilla alueilla.
    location_only: Näe kaikki kilpailutyypit {location}.
    default_suffix: Täältä löydät päivämäärät, matkat ja kaikki tiedot, joita tarvitset seuraavan kilpailusi suunnittelemiseen.
  browse_page_templates:
    county:
      title: '{label} juoksukilpailut | {site_name}'
      meta_description: Selaa juoksukilpailuja maakunnassa {label}. Vertaa päiviä, matkoja, kilpailutyyppejä ja käytännön tietoja ennen seuraavaa kisaasi.
      h1: Kilpailut maakunnassa {label}
      paragraph: Tälle sivulle on koottu juoksukilpailut maakunnassa {label}, jotta päiviä, matkoja, kilpailutyyppejä ja käytännön tietoja on helpompi vertailla. Käytä sitä, kun haluat selkeämmän kokonaiskuvan ennen ilmoittautumista.
    city:
      title: '{label} juoksukilpailut | {site_name}'
      meta_description: Löydä juoksukilpailuja kaupungissa {label}. Vertaa päiviä, matkoja, lähivaihtoehtoja ja käytännön tietoja.
      h1: Kilpailut lähellä kaupunkia {label}
      paragraph: Tämä kaupunkisivu auttaa selaamaan juoksukilpailuja, jotka liittyvät paikkaan {label}, mukaan lukien lähivaihtoehdot kisapäivän tai matkan suunnitteluun.
    month:
      title: '{label} juoksukilpailut | {site_name}'
      meta_description: Selaa juoksukilpailuja kuukaudessa {label} Suomessa. Vertaa päiviä, matkoja ja kilpailutyyppejä kauden suunnitteluun.
      h1: Kilpailut kuukaudessa {label}
      paragraph: Tämä sivu on juoksijoille, jotka haluavat kuukausinäkymän kalenteriin ja nopeamman tavan vertailla, mitä {label}-kuussa tapahtuu.
    race_type:
      title: '{label} juoksukilpailut Suomessa | {site_name}'
      meta_description: Selaa {label_lower}-kilpailuja Suomessa. Vertaa päiviä, matkoja, paikkoja ja käytännön tietoja.
      h1: '{label} juoksukilpailut Suomessa'
      paragraph: Tämä sivu keskittyy {label_lower}-kilpailuihin ja antaa selkeämmän kuvan, kun kilpailutyyppi on yhtä tärkeä kuin matka.
    category:
      title: '{label} juoksukilpailut Suomessa | {site_name}'
      meta_description: Selaa {label}-kilpailuja Suomessa. Vertaa päiviä, kilpailutyyppejä, paikkoja ja käytännön tietoja.
      h1: '{label} juoksukilpailut Suomessa'
      paragraph: Tämä matka- ja kategoriasivu kokoaa {label}-kilpailut yhteen, jotta sopivia vaihtoehtoja on helpompi vertailla.
    race_type_category:
      title: '{label} {secondary_label} juoksukilpailut Suomessa | {site_name}'
      meta_description: Selaa {label}-kilpailuja Suomessa tyypissä {secondary_label_lower}. Vertaa päiviä, paikkoja ja käytännön tietoja.
      h1: '{label} juoksukilpailut Suomessa ({secondary_label})'
      paragraph: Tämä sivu rajaa kalenterin {label}-kilpailuihin tyypissä {secondary_label_lower}, kun sekä matka että kilpailumuoto ratkaisevat valinnan.
    race_type_county:
      title: '{secondary_label} juoksukilpailut maakunnassa {label} | {site_name}'
      meta_description: Selaa {secondary_label_lower}-kilpailuja maakunnassa {label}. Vertaa päiviä, matkoja ja käytännön tietoja.
      h1: '{secondary_label} juoksukilpailut maakunnassa {label}'
      paragraph: Tämä sivu keskittyy {secondary_label_lower}-kilpailuihin maakunnassa {label}, jotta saman alueen vaihtoehtoja on helpompi vertailla.
    race_type_month:
      title: '{secondary_label} juoksukilpailut kuukaudessa {label} | {site_name}'
      meta_description: Selaa {secondary_label_lower}-kilpailuja ajankohtana {label_lower}. Vertaa päiviä, matkoja ja käytännön tietoja.
      h1: '{secondary_label} juoksukilpailut kuukaudessa {label}'
      paragraph: Tälle sivulle on koottu {secondary_label_lower}-kilpailut ajankohtana {label_lower} juoksijoille, jotka suunnittelevat kauden kalenterin kautta.
    race_type_city:
      title: '{secondary_label} juoksukilpailut lähellä kaupunkia {label} | {site_name}'
      meta_description: Selaa {secondary_label_lower}-kilpailuja, jotka liittyvät paikkaan {label}. Vertaa päiviä, matkoja ja lähivaihtoehtoja.
      h1: '{secondary_label} juoksukilpailut lähellä kaupunkia {label}'
      paragraph: Tälle sivulle on koottu {secondary_label_lower}-kilpailut, jotka liittyvät paikkaan {label}, jotta paikallista kisatarjontaa on nopeampi vertailla.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'You write evergreen SEO copy for indexable running race browse pages. Write for humans first, search intent second. Output valid JSON only. Keep the copy timeless: never mention a current year, current counts, limited-time wording, or freshness claims. Avoid keyword stuffing, hype, clickbait, superlatives, and unverifiable claims. Make each page clearly distinct based on the provided route context. Use natural Finnish suitable for a running calendar in Finland. Prefer concise titles, concise H1s, meta descriptions around 120-160 characters when practical, and a paragraph of 2-3 short sentences.'
  browse_guidance:
    county: User wants races in one region.
    city: User wants races connected to a city or nearby city.
    month: User wants races by month.
    race_type: User wants a specific race type.
    category: User wants a specific distance or race category.
    race_type_category: User wants a specific distance/category inside one race type.
    race_type_county: User wants a specific race type in one region.
    race_type_month: User wants a specific race type in one month.
    race_type_city: User wants a specific race type connected to one city.
