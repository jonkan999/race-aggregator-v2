privacy_page:
  title: Tietosuojakäytäntö
  meta_description: Tietosuojakäytäntö ja tiedot siitä, miten suomi-juoksu käsittelee henkilötietoja ja evästeitä.
  last_updated_label: Päivitetty viimeksi
  last_updated_date: 27. maaliskuuta 2026
  contact_intro: 'Tietosuojaan liittyvissä kysymyksissä ota yhteyttä:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Keräämämme tiedot
    intro: 'Keräämme tietoja, jotka annat suoraan, kun:'
    bullets:
    - luot tilin
    - lähetät kilpailutietoja
    - kirjoitat foorumille
    - otat meihin yhteyttä
  - title: 2. Evästeet ja seuranta
    intro: 'Käytämme evästeitä, jotta voimme:'
    bullets:
    - muistaa asetuksesi
    - ylläpitää istuntoa ja kirjautumista
    - analysoida liikennettä ja käyttöä
    - näyttää relevanttia mainontaa ja parantaa kokemusta
  - title: 3. Miten käytämme tietojasi
    intro: 'Tietosi auttavat meitä:'
    bullets:
    - tarjoamaan ja parantamaan palvelua
    - lähettämään tärkeitä ilmoituksia
    - vastaamaan pyyntöihin
    - estämään väärinkäytöksiä
  - title: 4. Oikeutesi
    intro: 'GDPR:n mukaan sinulla on oikeus:'
    bullets:
    - tarkastaa henkilötietosi
    - korjata virheelliset tiedot
    - pyytää tietojen poistamista
    - vastustaa tiettyä käsittelyä
    - pyytää tietojen siirtoa
  - title: 5. Ota yhteyttä
    intro: Jos sinulla on kysyttävää henkilötietojen tai evästeiden käsittelystä, voit aina ottaa meihin yhteyttä.
