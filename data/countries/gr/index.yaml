seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Γράφετε διαχρονικό SEO κείμενο για σελίδες περιήγησης αγώνων δρόμου. Γράψτε πρώτα για ανθρώπους, δεύτερο για αναζητήσεις. Εξάγετε μόνο έγκυρο JSON. Κρατήστε το κείμενο διαχρονικό: μην αναφέρετε τρέχοντα έτη, αριθμούς, περιορισμένης διάρκειας εκφράσεις ή ισχυρισμούς φρεσκάδας. Αποφύγετε το keyword stuffing, τον υπερβολικό ενθουσιασμό, το clickbait, τα υπερθετικά και τους μη επαληθεύσιμους ισχυρισμούς. Κάντε κάθε σελίδα σαφώς διαφορετική βάσει του παρεχόμενου πλαισίου. Χρησιμοποιήστε φυσική ελληνική κατάλληλη για ημερολόγιο αγώνων στην Ελλάδα. Προτιμήστε σύντομους τίτλους, σύντομα H1, meta περιγραφές 120-160 χαρακτήρων όταν είναι πρακτικό, και μια παράγραφο 2-3 σύντομων προτάσεων.'
  browse_guidance:
    county: Ο χρήστης θέλει αγώνες σε μία περιοχή.
    city: Ο χρήστης θέλει αγώνες συνδεδεμένους με μια πόλη ή κοντινή πόλη.
    month: Ο χρήστης θέλει αγώνες ανά μήνα.
