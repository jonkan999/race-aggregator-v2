    category: Ο χρήστης θέλει συγκεκριμένη απόσταση ή κατηγορία αγώνα.
    race_type_category: Ο χρήστης θέλει συγκεκριμένη απόσταση/κατηγορία μέσα σε έναν τύπο αγώνα.
    race_type_county: Ο χρήστης θέλει συγκεκριμένο τύπο αγώνα σε μία περιοχή.
    race_type_month: Ο χρήστης θέλει συγκεκριμένο τύπο αγώνα σε έναν μήνα.
    race_type_city: Ο χρήστης θέλει συγκεκριμένο τύπο αγώνα συνδεδεμένο με μία πόλη.
