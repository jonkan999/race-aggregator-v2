about_us:
  title: Σχετικά με το Καλεντάρι Αγώνων
  meta_description: Καλεντάρι Αγώνων - ο οδηγός σας για το τρέξιμο στην Ελλάδα
  content:
    intro: Καλώς ήρθατε στο Καλεντάρι Αγώνων - μια πρακτική πλατφόρμα για δρομείς σε όλη την Ελλάδα.
    mission: Αποστολή μας είναι να διευκολύνουμε τους δρομείς να βρίσκουν και να μοιράζονται πληροφορίες για αγώνες, προπόνηση και όλα όσα σχετίζονται με το τρέξιμο.
    story: Το Καλεντάρι Αγώνων δημιουργείται από την ανάγκη για έναν σύγχρονο και χρήσιμο χώρο όπου η ελληνική δρομική κοινότητα μπορεί να βρίσκει αγώνες συγκεντρωμένους σε ένα σημείο.
    features:
    - title: Πλήρες καλεντάρι αγώνων
      description: Συγκεντρώνουμε αγώνες από όλη την Ελλάδα σε ένα σημείο, από μικρότερες τοπικές διοργανώσεις μέχρι μεγάλους διεθνείς αγώνες.
    - title: Με γνώμονα την κοινότητα
      description: Η πλατφόρμα μας κινείται από δρομείς σαν εσάς. Ο καθένας μπορεί να συνεισφέρει πληροφορίες για αγώνες και να συμμετέχει στις συζητήσεις.
    - title: Δωρεάν εργαλεία
      description: Προσφέρουμε χρήσιμα εργαλεία όπως υπολογιστές ρυθμού, προγράμματα προπόνησης και σχεδιασμό διαδρομών - εντελώς δωρεάν.
    closing: Συνεχίζουμε να εξελίσσουμε την πλατφόρμα με βάση τα σχόλια των χρηστών μας. Έχετε προτάσεις βελτίωσης; Επικοινωνήστε μαζί μας!
contact:
  title: Επικοινωνήστε μαζί μας
  meta_description: Επικοινωνήστε με το Καλεντάρι Αγώνων - είμαστε εδώ για να βοηθήσουμε
  content:
