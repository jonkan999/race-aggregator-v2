privacy_page:
  title: Πολιτική Απορρήτου
  meta_description: Πολιτική απορρήτου και πληροφορίες για το πώς το Καλεντάρι Αγώνων διαχειρίζεται προσωπικά δεδομένα και cookies.
  last_updated_label: Τελευταία ενημέρωση
  last_updated_date: 15 Απριλίου 2026
  contact_intro: 'Για ερωτήσεις και αιτήματα σχετικά με το απόρρητο, παρακαλούμε επικοινωνήστε μαζί μας στο:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Πληροφορίες που Συλλέγουμε
    intro: 'Συλλέγουμε πληροφορίες που παρέχετε απευθείας σε εμάς όταν:'
    bullets:
    - Δημιουργείτε λογαριασμό
    - Υποβάλλετε πληροφορίες αγώνα
    - Αναρτάτε στο forum
    - Επικοινωνείτε μαζί μας
  - title: 2. Cookies και Παρακολούθηση
    intro: 'Χρησιμοποιούμε cookies για να:'
    bullets:
    - Θυμόμαστε τις προτιμήσεις σας
    - Διατηρούμε τη συνεδρία και την κατάσταση σύνδεσής σας
    - Ανάλυση της κίνησης και της χρήσης του ιστότοπου
    - Εμφάνιση σχετικής διαφήμισης και βελτίωση της εμπειρίας
  - title: 3. Πώς Χρησιμοποιούμε τις Πληροφορίες Σας
    intro: 'Οι πληροφορίες σας μας βοηθούν να:'
    bullets:
    - Παρέχουμε και βελτιώνουμε τις υπηρεσίες μας
    - Αποστέλλουμε σημαντικές ειδοποιήσεις και ενημερώσεις
    - Ανταποκρινόμαστε σε αιτήματα και ερωτήσεις υποστήριξης
    - Αποτρέπουμε απάτες και κακή χρήση
  - title: 4. Τα Δικαιώματά Σας
    intro: 'Σύμφωνα με τον GDPR, έχετε το δικαίωμα να:'
    bullets:
    - Έχετε πρόσβαση στα προσωπικά σας δεδομένα
    - Διορθώσετε ανακριβή ή ελλιπή δεδομένα
    - Ζητήσετε διαγραφή των δεδομένων σας
    - Αντιταχθείτε σε ορισμένες δραστηριότητες επεξεργασίας
    - Ζητήσετε φορητότητα δεδομένων
  - title: 5. Επικοινωνήστε Μαζί Μας
    intro: Αν έχετε ερωτήσεις σχετικά με το πώς επεξεργαζόμαστε προσωπικά δεδομένα ή χρησιμοποιούμε cookies, είστε πάντα ευπρόσδεκτοι να επικοινωνήσετε μαζί μας.
