seo_templates:
  title_parts:
    category: '{category} αγώνες'
    race_type: '{race_type}'
    location: στο {location}
    default: Όλοι οι αγώνες
  paragraph_templates:
    category_race_location: Βρείτε {category} {race_type} αγώνες στο {location}.
    category_race: Εξερευνήστε {category} {race_type} αγώνες σε όλη την Ελλάδα.
    category_location: Ανακαλύψτε {category} αγώνες στο {location}.
    race_location: Δείτε όλους τους {race_type} αγώνες στο {location}.
    category_only: Βρείτε {category} αγώνες σε όλη την Ελλάδα.
    race_only: Εξερευνήστε {race_type} αγώνες σε όλες τις περιοχές.
    location_only: Δείτε όλους τους τύπους αγώνων στο {location}.
    default_suffix: Εδώ θα βρείτε ημερομηνίες, αποστάσεις και όλες τις πληροφορίες που χρειάζεστε για να σχεδιάσετε τον επόμενο αγώνα σας.
  browse_page_templates:
    county:
      title: '{label} αγώνες | {site_name}'
      meta_description: Περιηγηθείτε σε αγώνες δρόμου στο {label}. Συγκρίνετε ημερομηνίες, αποστάσεις, μορφές αγώνων και πρακτικές λεπτομέρειες πριν επιλέξετε τον επόμενο αγώνα σας.
      h1: Αγώνες στο {label}
      paragraph: Αυτή η σελίδα συγκεντρώνει αγώνες δρόμου στο {label} ώστε να είναι πιο εύκολο να συγκρίνετε ημερομηνίες, αποστάσεις, μορφές αγώνων και πρακτικές λεπτομέρειες σε ένα μέρος. Χρησιμοποιήστε την όταν θέλετε μια πιο ξεκάθαρη εικόνα πριν επιλέξετε τον επόμενο αγώνα σας.
    city:
      title: '{label} αγώνες | {site_name}'
      meta_description: Βρείτε αγώνες δρόμου που σχετίζονται με το {label}. Συγκρίνετε ημερομηνίες, αποστάσεις, κοντινές επιλογές και πρακτικές λεπτομέρειες πριν επιλέξετε τον επόμενο αγώνα σας.
      h1: Αγώνες κοντά σε {label}
      paragraph: Αυτή η σελίδα πόλης σας βοηθά να περιηγηθείτε σε αγώνες δρόμου συνδεδεμένους με το {label}, συμπεριλαμβανομένων κοντινών εναλλακτικών που είναι χρήσιμες για τον προγραμματισμό μιας ημέρας αγώνα ή ταξιδιού. Έχει σχεδιαστεί για να κάνει την τοπική αναζήτηση αγώνων πιο γρήγορη και εύκολη στη σύγκριση.
    month:
      title: Αγώνες {label} | {site_name}
      meta_description: Περιηγηθείτε σε αγώνες δρόμου στο {label} στην {market}. Συγκρίνετε ημερομηνίες, αποστάσεις, τύπους αγώνων και πρακτικές λεπτομέρειες πριν οργανώσετε τη σεζόν σας.
      h1: Αγώνες στο {label}
      paragraph: Αυτή η σελίδα απευθύνεται σε δρομείς που θέλουν μια μηνιαία επισκόπηση του ημερολογίου και χρειάζονται έναν γρηγορότερο τρόπο να συγκρίνουν τι συμβαίνει στο {label}. Βοηθά να περιορίσετε τις επιλογές πριν εστιάσετε σε αποστάσεις, επιφάνειες και τοποθεσίες αγώνων.
    race_type:
      title: Αγώνες {label} στην {market} | {site_name}
      meta_description: Περιηγηθείτε σε αγώνες {label_lower} στην {market}. Συγκρίνετε ημερομηνίες, αποστάσεις, τοποθεσίες και πρακτικές λεπτομέρειες πριν επιλέξετε τον κατάλληλο αγώνα για εσάς.
      h1: Αγώνες {label} στην {market}
      paragraph: Αυτή η σελίδα εστιάζει σε αγώνες {label_lower} και σας προσφέρει μια πιο καθαρή επισκόπηση όταν η μορφή του αγώνα έχει τόση σημασία όσο και η απόσταση. Χρησιμοποιήστε την για να συγκρίνετε επιλογές ανά περιοχές, ημερομηνίες και πρακτικές λεπτομέρειες χωρίς να ξεκινάτε από το πλήρες ημερολόγιο.
    category:
      title: Αγώνες {label} στην {market} | {site_name}
      meta_description: Περιηγηθείτε σε αγώνες {label} στην {market}. Συγκρίνετε ημερομηνίες, τύπους αγώνων, τοποθεσίες και πρακτικές λεπτομέρειες πριν αποφασίσετε για την επόμενη διοργάνωσή σας.
      h1: Αγώνες {label} στην {market}
      paragraph: Αυτή η σελίδα απόστασης και κατηγορίας συγκεντρώνει αγώνες που ταιριάζουν με {label} ώστε να είναι πιο εύκολη η σύγκριση σχετικών επιλογών σε ένα μέρος. Είναι σχεδιασμένη για δρομείς που θέλουν γρηγορότερη μετάβαση από την ευρεία περιήγηση σε μια σύντομη λίστα ρεαλιστικών αγώνων.
    race_type_category:
      title: Αγώνες {label} {secondary_label} στην {market} | {site_name}
      meta_description: Περιηγηθείτε σε αγώνες {label} στην {market} μέσα στον τύπο αγώνα {secondary_label_lower}. Συγκρίνετε ημερομηνίες, τοποθεσίες και πρακτικές λεπτομέρειες πριν επιλέξετε την επόμενη διοργάνωσή σας.
      h1: Αγώνες {label} στην {market} ({secondary_label})
