  browse_page_templates:
    county:
      title: '{label} trke | {site_name}'
      meta_description: Pregledaj trke u {label}. Uporedi datume, distance, format trke i praktične detalje pre nego što izabereš sledeću trku.
      h1: Trke u {label}
      paragraph: Ova stranica okuplja trke u {label} kako bi bilo lakše da na jednom mestu uporediš datume, distance, format trke i praktične informacije.
    city:
      title: '{label} trke | {site_name}'
      meta_description: Pronađi trke povezane sa {label}. Uporedi datume, distance, obližnje opcije i praktične detalje pre izbora sledeće trke.
      h1: Trke u blizini {label}
      paragraph: Ova gradska stranica pomaže da pregledaš trke povezane sa {label}, uključujući obližnje alternative koje imaju smisla kada planiraš trkački dan ili put.
    month:
      title: '{label} trke | {site_name}'
      meta_description: Pregledaj trke u {label_lower} u {market}. Uporedi datume, distance, vrste trka i praktične detalje dok planiraš sezonu.
      h1: Trke u {label}
      paragraph: Ova stranica pomaže trkačima da kalendar pregledaju mesec po mesec i brže vide šta se dešava u {label_lower} pre nego što suze izbor po distanci, podlozi ili mestu.
    race_type:
      title: '{label} trke u {market} | {site_name}'
      meta_description: Pregledaj {label_lower} trke u {market}. Uporedi datume, distance, lokacije i praktične detalje pre nego što izabereš trku koja ti odgovara.
      h1: '{label} trke u {market}'
      paragraph: Ova stranica je fokusirana na {label_lower} trke i daje jasniji pregled kada je format trke podjednako važan kao i distanca.
    category:
      title: '{label} trke u {market} | {site_name}'
      meta_description: Pregledaj {label} trke u {market}. Uporedi datume, vrste trka, lokacije i praktične detalje pre izbora sledećeg događaja.
      h1: '{label} trke u {market}'
      paragraph: Ova stranica po distanci i kategoriji okuplja trke koje odgovaraju {label}, kako bi relevantne opcije bilo lakše uporediti na jednom mestu.
    race_type_category:
      title: '{label} {secondary_label} trke u {market} | {site_name}'
      meta_description: Pregledaj {label} trke u {market} unutar vrste trke {secondary_label_lower}. Uporedi datume, lokacije i praktične detalje pre nego što izabereš sledeći događaj.
      h1: '{label} trke u {market} ({secondary_label})'
      paragraph: Ova stranica sužava kalendar na {label} trke unutar vrste {secondary_label_lower}, što pomaže kada izbor zavisi i od distance i od formata trke.
    race_type_county:
      title: '{secondary_label} trke u {label} | {site_name}'
      meta_description: Pregledaj {secondary_label_lower} trke u {label}. Uporedi datume, distance i praktične detalje pre izbora sledeće trke.
      h1: '{secondary_label} trke u {label}'
      paragraph: Ova stranica je fokusirana na {secondary_label_lower} trke u {label}, pa je lakše uporediti najrelevantnije opcije u okviru istog okruga.
    race_type_month:
      title: '{secondary_label} trke u {label} | {site_name}'
      meta_description: Pregledaj {secondary_label_lower} trke u {label_lower}. Uporedi datume, distance i praktične detalje dok planiraš sezonu.
      h1: '{secondary_label} trke u {label}'
      paragraph: Ova stranica okuplja {secondary_label_lower} trke u {label_lower} za trkače koji prvo planiraju po kalendaru.
    race_type_city:
      title: '{secondary_label} trke u blizini {label} | {site_name}'
