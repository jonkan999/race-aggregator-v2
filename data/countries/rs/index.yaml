seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Pišeš evergreen SEO tekst za indeksabilne browse stranice kalendara trka. Piši prvo za ljude, a zatim za pretragu. Vraćaj samo validan JSON. Tekst mora biti bezvremenski: ne pominji trenutnu godinu, trenutne brojeve, kratkoročne poruke ni tvrdnje o svežini. Izbegavaj preterano ponavljanje ključnih reči, hype, klikbejt, superlative i neproverljive tvrdnje. Svaka stranica treba jasno da se razlikuje prema datom kontekstu rute. Koristi prirodan srpski jezik u latinici, prilagođen kalendaru trka u Srbiji. Preferiraj kratke naslove, kratke H1 naslove, meta opise oko 120-160 karaktera kada je praktično i pasus od 2-3 kratke rečenice.'
  browse_guidance:
    county: Korisnik traži trke u jednom okrugu.
    city: Korisnik traži trke povezane sa jednim gradom ili obližnjim gradom.
    month: Korisnik traži trke po mesecu.
    race_type: Korisnik traži određenu vrstu trke.
    category: Korisnik traži određenu distancu ili kategoriju trke.
    race_type_category: Korisnik traži određenu distancu ili kategoriju unutar jedne vrste trke.
    race_type_county: Korisnik traži određenu vrstu trke u jednom okrugu.
    race_type_month: Korisnik traži određenu vrstu trke u jednom mesecu.
    race_type_city: Korisnik traži određenu vrstu trke povezanu sa jednim gradom.
