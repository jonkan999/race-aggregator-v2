about_us:
  title: O Kalendaru trka
  meta_description: Kalendar trka - vaš vodič za trčanje i trke u Srbiji
  content:
    intro: Dobrodošli na Kalendar trka - preglednije mesto za trkače u Srbiji.
    mission: Naša misija je da trkačima olakšamo pronalaženje, poređenje i deljenje informacija o trkama, treningu i trkačkom životu u Srbiji.
    story: Kalendar trka nastaje zahvaljujući trkačima koji su želeli jasniji i korisniji pregled drumskih i trail trka širom Srbije.
    features:
    - title: Fokusiran kalendar trka
      description: Skupljamo trke iz cele Srbije na jednom mestu, od lokalnih drumskih trka do velikih trail događaja.
    - title: Pokreće ga zajednica
      description: Platforma postaje bolja kroz doprinose, ispravke i povratne informacije trkača i organizatora.
    - title: Korisni besplatni alati
      description: Tu su i praktični alati kao što su kalkulator tempa, procena vremena na cilju, planovi treninga i merenje rute.
    closing: Nastavićemo da unapređujemo platformu na osnovu povratnih informacija. Ako primetite da nešto nedostaje ili nije tačno, javite nam se.
contact:
  title: Kontakt
  meta_description: Kontaktirajte Kalendar trka i pošaljite ispravke ili predloge.
  content:
    intro: 'Biće nam drago da nam se javite. Evo najboljih načina da stupite u kontakt sa nama:'
    email:
      title: Email
      address: hello@kalendartrka.com
      description: Najčešće odgovaramo u roku od jednog radnog dana.
    social:
      title: Društvene mreže
      description: Pratite buduća ažuriranja i nove trke preko naših društvenih kanala.
    feedback:
      title: Povratne informacije
      description: Svaka povratna informacija koja pomaže da Kalendar trka bude bolji za trkače i organizatore nam znači.
privacy_page:
  title: Politika privatnosti
  meta_description: Politika privatnosti i informacije o tome kako Kalendar trka obrađuje lične podatke i kolačiće.
  last_updated_label: Poslednje ažuriranje
  last_updated_date: 16. april 2026.
  contact_intro: 'Za pitanja i zahteve u vezi sa privatnošću, kontaktirajte nas na:'
  contact_email: hello@kalendartrka.com
  sections:
  - title: 1. Koje informacije prikupljamo
    intro: 'Prikupljamo informacije koje nam direktno dostavite kada:'
    bullets:
    - Kreirate nalog
    - Pošaljete informacije o trci
    - Objavite poruku na forumu
    - Kontaktirate nas
  - title: 2. Kolačići i praćenje
    intro: 'Kolačiće koristimo da bismo:'
    bullets:
    - Zapamtili vaše postavke
    - Održali sesiju i stanje prijave
    - Analizirali saobraćaj i korišćenje sajta
    - Poboljšali iskustvo korišćenja sajta
  - title: 3. Kako koristimo vaše informacije
    intro: 'Vaše informacije nam pomažu da:'
    bullets:
    - Pružimo i unapredimo usluge
    - Pošaljemo važna obaveštenja i novosti
    - Odgovorimo na zahteve i pitanja za podršku
    - Sprečimo zloupotrebe i prevare
  - title: 4. Vaša prava
    intro: 'Prema GDPR-u imate pravo da:'
    bullets:
    - Pristupite svojim ličnim podacima
    - Ispravite netačne ili nepotpune podatke
    - Zatražite brisanje podataka
    - Prigovorite određenim obradama
    - Zatražite prenosivost podataka
  - title: 5. Kontakt
    intro: Ako imate pitanja o tome kako obrađujemo lične podatke ili koristimo kolačiće, uvek nam se možete javiti.
