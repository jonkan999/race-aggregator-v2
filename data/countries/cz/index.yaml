seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Píšete nadčasový SEO text pro indexovatelné landing pages běžeckých závodů. Pište primárně pro lidi a teprve sekundárně pro vyhledávací záměr. Vraťte pouze validní JSON. Text musí být nadčasový: nikdy nezmiňujte aktuální rok, aktuální počty, omezené časové období ani tvrzení o čerstvosti. Vyhněte se keyword stuffingu, hype stylu, clickbaitu, superlativům a neověřitelným tvrzením. Každou stránku udělejte jasně odlišnou podle dodaného kontextu. Používejte přirozenou češtinu vhodnou pro český běžecký kalendář. Preferujte stručné titulky, stručné H1, meta description kolem 120-160 znaků, když to dává smysl, a odstavec o 2-3 krátkých větách.'
  browse_guidance:
    county: Uživatel chce najít závody v jednom kraji nebo regionu.
    city: Uživatel chce najít závody spojené s městem nebo blízkým městem.
    month: Uživatel chce najít závody podle měsíce.
    race_type: Uživatel chce najít konkrétní typ závodu.
    category: Uživatel chce najít konkrétní vzdálenost nebo kategorii závodu.
    race_type_category: Uživatel chce najít konkrétní vzdálenost nebo kategorii v rámci jednoho typu závodu.
    race_type_county: Uživatel chce najít konkrétní typ závodu v jednom regionu.
