privacy_page:
  title: Zásady ochrany osobních údajů
  meta_description: Zásady ochrany osobních údajů a informace o tom, jak Běžecký kalendář pracuje s osobními údaji a cookies.
  last_updated_label: Naposledy aktualizováno
  last_updated_date: 27. března 2026
  contact_intro: 'S dotazy týkajícími se soukromí a osobních údajů nás můžete kontaktovat na:'
  contact_email: info@bezeckykalendar.com
  sections:
  - title: 1. Jaké informace shromažďujeme
    intro: 'Shromažďujeme informace, které nám přímo poskytujete, když:'
    bullets:
    - Vytváříte účet
    - Odesíláte informace o závodu
    - Publikujete příspěvky ve fóru
    - Kontaktujete nás
  - title: 2. Cookies a měření
    intro: 'Cookies používáme k tomu, abychom:'
    bullets:
    - si pamatovali vaše nastavení
    - udrželi vaše přihlášení a relaci
    - analyzovali návštěvnost a používání webu
    - zobrazovali relevantní reklamu a zlepšovali obsah
  - title: 3. Jak vaše informace používáme
    intro: 'Vaše informace nám pomáhají:'
    bullets:
    - poskytovat a zlepšovat naše služby
    - posílat důležité aktualizace a upozornění
    - odpovídat na dotazy a podporu
    - předcházet podvodům a zneužití
  - title: 4. Vaše práva
    intro: 'Podle GDPR máte právo:'
    bullets:
    - požádat o přístup ke svým osobním údajům
    - opravit nepřesné nebo neúplné údaje
    - požádat o výmaz svých údajů
    - vznést námitku proti určitému zpracování osobních údajů
    - požádat o přenositelnost dat
  - title: 5. Kontakt
    intro: Pokud máte otázky k tomu, jak zpracováváme osobní údaje nebo používáme cookies, kdykoli se nám ozvěte.
