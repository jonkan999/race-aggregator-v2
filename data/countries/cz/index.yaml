seo_templates:
  title_parts:
    category: '{category} závody'
    race_type: '{race_type}'
    location: v {location}
    default: Všechny závody
  paragraph_templates:
    category_race_location: Najděte {category} {race_type} závody v {location}.
    category_race: Prozkoumejte {category} {race_type} závody po celém Česku.
    category_location: Objevte {category} závody v {location}.
    race_location: Zobrazte všechny {race_type} závody v {location}.
    category_only: Najděte {category} závody po celém Česku.
    race_only: Prozkoumejte {race_type} závody ve všech krajích.
    location_only: Zobrazte všechny typy závodů v {location}.
    default_suffix: Najdete zde termíny, vzdálenosti a praktické informace pro plánování svého dalšího závodu.
  browse_page_templates:
    county:
      title: '{label} závody | {site_name}'
      meta_description: Procházejte běžecké závody v {label}. Porovnejte termíny, vzdálenosti, formát závodu i praktické informace před výběrem dalšího závodu.
      h1: Závody v {label}
      paragraph: Tato stránka shromažďuje běžecké závody v {label}, aby bylo snazší porovnat termíny, vzdálenosti, formát závodu a praktické informace na jednom místě. Hodí se ve chvíli, kdy chcete lepší přehled před výběrem dalšího závodu.
    city:
      title: '{label} závody | {site_name}'
      meta_description: Najděte běžecké závody spojené s {label}. Porovnejte termíny, vzdálenosti, blízké alternativy a praktické informace před svým dalším závodem.
      h1: Závody v okolí {label}
      paragraph: Tato městská stránka pomáhá procházet běžecké závody spojené s {label}, včetně blízkých alternativ, které dávají smysl při plánování závodního dne nebo cesty. Je navržena tak, aby bylo místní objevování závodů rychlejší a přehlednější.
    month:
      title: '{label} závody | {site_name}'
      meta_description: Procházejte běžecké závody v {label_lower} v {market}. Porovnejte termíny, vzdálenosti, typy závodů a praktické informace při plánování sezony.
      h1: Závody v {label}
      paragraph: Tato stránka je pro běžce, kteří chtějí vidět kalendář měsíc po měsíci a rychleji porovnat, co se děje v {label_lower}. Pomůže zúžit výběr dřív, než se pustíte do porovnávání vzdáleností, povrchů a míst konání.
    race_type:
      title: Závody typu {label} v {market} | {site_name}
      meta_description: Procházejte závody typu {label_lower} v {market}. Porovnejte termíny, vzdálenosti, lokality a praktické informace před výběrem závodu, který vám sedí.
      h1: Závody typu {label} v {market}
      paragraph: Tato stránka se soustředí na závody typu {label_lower} a nabízí jasnější přehled v situaci, kdy je formát závodu stejně důležitý jako vzdálenost. Hodí se pro porovnání možností napříč kraji, termíny a praktickými detaily bez nutnosti začínat od celé databáze.
    category:
      title: Závody v {market} pro {label} | {site_name}
      meta_description: Procházejte závody v {market} pro kategorii {label}. Porovnejte termíny, typy závodů, lokality a praktické informace před výběrem další akce.
      h1: Závody v {market} pro {label}
      paragraph: Tato stránka podle vzdálenosti a kategorie shromažďuje závody odpovídající {label}, aby bylo snazší porovnat relevantní možnosti na jednom místě. Je určená běžcům, kteří chtějí rychleji přejít od širokého procházení ke krátkému seznamu realistických závodů.
    race_type_category:
      title: Závody v {market} pro {label} ({secondary_label}) | {site_name}
      meta_description: Procházejte závody v {market} pro {label} v rámci typu závodu {secondary_label_lower}. Porovnejte termíny, lokality a praktické informace před výběrem dalšího závodu.
      h1: Závody v {market} pro {label} ({secondary_label})
      paragraph: Tato stránka zužuje kalendář na závody {label} v rámci typu {secondary_label_lower}, což se hodí ve chvíli, kdy výběr ovlivňuje jak vzdálenost, tak formát závodu. Pomůže porovnat podobnější možnosti dřív, než se definitivně rozhodnete.
    race_type_county:
      title: '{secondary_label} závody v {label} | {site_name}'
      meta_description: Procházejte {secondary_label_lower} závody v {label}. Porovnejte termíny, vzdálenosti a praktické informace před výběrem dalšího závodu.
      h1: '{secondary_label} závody v {label}'
      paragraph: Tato stránka se soustředí na {secondary_label_lower} závody v {label}, aby bylo snazší porovnat relevantnější možnosti v rámci stejného kraje. Hodí se, když výběr určuje jak geografie, tak formát závodu.
    race_type_month:
      title: '{secondary_label} závody v {label} | {site_name}'
      meta_description: Procházejte {secondary_label_lower} závody v {label_lower}. Porovnejte termíny, vzdálenosti a praktické informace při plánování sezony.
      h1: '{secondary_label} závody v {label}'
      paragraph: Tato stránka shromažďuje {secondary_label_lower} závody v {label_lower} pro běžce, kteří plánují hlavně podle kalendáře a sezony. Pomáhá porovnat podobné formáty závodů dřív, než přejdete k místu konání a vzdálenosti.
    race_type_city:
      title: '{secondary_label} závody poblíž {label} | {site_name}'
      meta_description: Procházejte {secondary_label_lower} závody spojené s {label}. Porovnejte termíny, vzdálenosti a blízké alternativy před dalším závodem.
      h1: '{secondary_label} závody poblíž {label}'
      paragraph: Tato stránka shromažďuje {secondary_label_lower} závody spojené s {label}, aby bylo místní porovnávání závodů rychlejší. Hodí se, když chcete najít konkrétní formát závodu poblíž jednoho města, aniž byste začínali od celé databáze.'
