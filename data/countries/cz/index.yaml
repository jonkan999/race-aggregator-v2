about_us:
  title: O Běžeckém kalendáři
  meta_description: Běžecký kalendář - váš průvodce běháním v Česku
  content:
    intro: Vítejte v Běžeckém kalendáři - místě, které pomáhá běžcům v Česku objevovat závody a plánovat sezonu.
    mission: Naším cílem je usnadnit běžcům hledání i sdílení informací o závodech, tréninku a všem, co s běháním souvisí.
    story: Běžecký kalendář vznikl z potřeby mít přehledný a užitečný prostor, kde česká běžecká komunita najde závody na jednom místě.
    features:
    - title: Přehled závodů
      description: Shromažďujeme běžecké závody z celého Česka na jednom místě - od menších lokálních akcí po známé velké podniky.
    - title: Tvořeno komunitou
      description: Platforma roste díky běžcům. Každý může doplnit informace o závodu nebo se zapojit do diskuse.
    - title: Užitečné nástroje zdarma
      description: Nabízíme praktické nástroje jako převodník tempa, tréninkové plány nebo měření trasy - zdarma.
    closing: Web dál vylepšujeme podle zpětné vazby od běžců. Máte nápad na zlepšení? Ozvěte se nám.
