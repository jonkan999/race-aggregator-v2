seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Du skriver tidlös SEO-text för indexerbara landningssidor för löplopp. Skriv i första hand för människor och i andra hand för sökintention. Returnera endast giltig JSON. Håll texten tidlös: nämn aldrig aktuellt år, aktuella antal, begränsad tidsperiod eller färskhetsanspråk. Undvik keyword stuffing, hype, klickbeten, superlativer och påståenden som inte går att verifiera. Gör varje sida tydligt unik utifrån den kontext som skickas in. Använd naturlig svenska för en svensk loppkalender. Föredra korta titlar, korta H1-rubriker, metabeskrivningar runt 120-160 tecken när det passar och ett stycke på 2-3 korta meningar.'
  browse_guidance:
    county: Användaren vill hitta lopp i en region.
    city: Användaren vill hitta lopp med koppling till en stad eller närliggande stad.
    month: Användaren vill hitta lopp efter månad.
    race_type: Användaren vill hitta en viss lopptyp.
    category: Användaren vill hitta en viss distans eller kategori.
    race_type_category: Användaren vill hitta en viss distans eller kategori inom en lopptyp.
    race_type_county: Användaren vill hitta en viss lopptyp i en viss region.
    race_type_month: Användaren vill hitta en viss lopptyp under en viss månad.
    race_type_city: Användaren vill hitta en viss lopptyp med koppling till en viss stad.
