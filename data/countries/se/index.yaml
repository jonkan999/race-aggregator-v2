privacy_page:
  title: Integritetspolicy
  meta_description: Integritetspolicy och information om hur LoppKartan hanterar personuppgifter och cookies.
  last_updated_label: Senast uppdaterad
  last_updated_date: 27 mars 2026
  contact_intro: 'För frågor som rör integritet och personuppgifter kan du kontakta oss på:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Information vi samlar in
    intro: 'Vi samlar in information som du lämnar direkt till oss när du:'
    bullets:
    - Skapar ett konto
    - Skickar in information om lopp
    - Publicerar inlägg i forumet
    - Kontaktar oss
  - title: 2. Cookies och spårning
    intro: 'Vi använder cookies för att:'
    bullets:
    - Komma ihåg dina inställningar
    - Hålla dig inloggad och spara din session
    - Analysera trafik och användning av webbplatsen
    - Visa relevanta annonser och förbättra innehållet
  - title: 3. Hur vi använder din information
    intro: 'Din information hjälper oss att:'
    bullets:
    - Tillhandahålla och förbättra våra tjänster
    - Skicka viktiga uppdateringar och notiser
    - Svara på frågor och supportärenden
    - Förebygga bedrägerier och missbruk
  - title: 4. Dina rättigheter
    intro: 'Enligt GDPR har du rätt att:'
    bullets:
    - Begära tillgång till dina personuppgifter
    - Rätta felaktiga eller ofullständiga uppgifter
    - Begära att dina uppgifter raderas
    - Invända mot viss behandling av personuppgifter
    - Begära dataportabilitet
  - title: 5. Kontakta oss
    intro: Om du har frågor om hur vi behandlar personuppgifter eller använder cookies är du alltid välkommen att höra av dig.
