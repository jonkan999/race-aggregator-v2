seo_templates:
  title_parts:
    category: '{category} lopp'
    race_type: '{race_type}'
    location: i {location}
    default: Alla lopp
  paragraph_templates:
    category_race_location: Hitta {category} {race_type}lopp i {location}.
    category_race: Utforska {category} {race_type}lopp i hela Sverige.
    category_location: Upptäck {category} lopp i {location}.
    race_location: Se alla {race_type}lopp i {location}.
    category_only: Hitta {category} lopp över hela Sverige.
    race_only: Utforska {race_type}lopp i alla regioner.
    location_only: Se alla typer av lopp i {location}.
    default_suffix: Här hittar du datum, distanser och all information du behöver för att planera ditt nästa lopp.
  browse_page_templates:
    county:
      title: '{label} lopp | {site_name}'
      meta_description: Bläddra bland löplopp i {label}. Jämför datum, distanser, loppformat och praktisk information inför ditt nästa lopp.
      h1: Lopp i {label}
      paragraph: Den här sidan samlar löplopp i {label} för att göra det enklare att jämföra datum, distanser, loppformat och praktisk information på ett ställe. Använd den när du vill få bättre överblick inför valet av ditt nästa lopp.
    city:
      title: '{label} lopp | {site_name}'
      meta_description: Hitta löplopp med koppling till {label}. Jämför datum, distanser, närliggande alternativ och praktisk information inför ditt nästa lopp.
      h1: Lopp nära {label}
      paragraph: Den här stadssidan hjälper dig att bläddra bland löplopp med koppling till {label}, inklusive närliggande alternativ som är relevanta när du planerar en tävlingsdag eller resa. Den är byggd för att göra lokal loppupptäckt snabbare och enklare att jämföra.
    month:
      title: '{label} lopp | {site_name}'
      meta_description: Bläddra bland löplopp i {label_lower} i {market}. Jämför datum, distanser, lopptyper och praktisk information när du planerar säsongen.
      h1: Lopp i {label}
      paragraph: Den här sidan är till för löpare som vill se kalendern månad för månad och behöver ett snabbare sätt att jämföra vad som händer i {label_lower}. Den hjälper dig att smalna av urvalet innan du går vidare till distanser, underlag och tävlingsorter.
    race_type:
      title: Lopp av typen {label} i {market} | {site_name}
      meta_description: Bläddra bland lopp av typen {label_lower} i {market}. Jämför datum, distanser, orter och praktisk information innan du väljer ett lopp som passar dig.
      h1: Lopp av typen {label} i {market}
      paragraph: Den här sidan fokuserar på lopp av typen {label_lower} och ger dig en tydligare överblick när loppformatet är lika viktigt som distansen. Använd den för att jämföra alternativ mellan regioner, datum och praktiska detaljer utan att börja i hela kalendern.
    category:
      title: Lopp i {market} för {label} | {site_name}
      meta_description: Bläddra bland lopp i {market} för kategorin {label}. Jämför datum, lopptyper, orter och praktisk information innan du bestämmer dig för nästa tävling.
      h1: Lopp i {market} för {label}
      paragraph: Den här distans- och kategorisidan samlar lopp som matchar {label} för att göra det enklare att jämföra relevanta alternativ på ett ställe. Den är gjord för löpare som vill gå snabbare från bred bläddring till en kortlista med realistiska lopp.
    race_type_category:
      title: Lopp i {market} för {label} ({secondary_label}) | {site_name}
      meta_description: Bläddra bland lopp i {market} för {label} inom lopptypen {secondary_label_lower}. Jämför datum, orter och praktisk information innan du väljer ditt nästa lopp.
      h1: Lopp i {market} för {label} ({secondary_label})
      paragraph: Den här sidan smalnar av kalendern till {label} lopp inom lopptypen {secondary_label_lower}, vilket är hjälpsamt när både distans och loppformat påverkar vad som passar bäst. Använd den för att jämföra mer likvärdiga alternativ innan du bestämmer dig för ett lopp.
    race_type_county:
      title: '{secondary_label}lopp i {label} | {site_name}'
      meta_description: Bläddra bland {secondary_label_lower}lopp i {label}. Jämför datum, distanser och praktisk information innan du väljer nästa lopp.
      h1: '{secondary_label}lopp i {label}'
      paragraph: Den här sidan fokuserar på {secondary_label_lower}lopp i {label} för att göra det lättare att jämföra mer relevanta alternativ inom samma region. Den passar när både geografin och loppformatet styr urvalet.
    race_type_month:
      title: '{secondary_label}lopp i {label} | {site_name}'
      meta_description: Bläddra bland {secondary_label_lower}lopp i {label_lower}. Jämför datum, distanser och praktisk information när du planerar säsongen.
      h1: '{secondary_label}lopp i {label}'
      paragraph: Den här sidan samlar {secondary_label_lower}lopp i {label_lower} för löpare som planerar efter säsong och kalender. Den hjälper dig att jämföra lopp med liknande upplägg innan du går vidare till ort och distans.
    race_type_city:
      title: '{secondary_label}lopp nära {label} | {site_name}'
      meta_description: Bläddra bland {secondary_label_lower}lopp med koppling till {label}. Jämför datum, distanser och närliggande alternativ inför nästa lopp.
      h1: '{secondary_label}lopp nära {label}'
      paragraph: Den här sidan samlar {secondary_label_lower}lopp med koppling till {label} för att göra lokal loppjämförelse snabbare. Den är användbar när du vill hitta rätt loppformat nära en viss stad utan att börja i hela kalendern.
