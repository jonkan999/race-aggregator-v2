      paragraph: Šis puslapis skirtas bėgikams, kurie nori matyti kalendorių pagal mėnesį ir greičiau palyginti, kas vyksta {label}.
    race_type:
      title: '{label} bėgimai rinkoje {market} | {site_name}'
      meta_description: Naršykite {label_lower} bėgimus rinkoje {market}. Palyginkite datas, distancijas ir vietas.
      h1: '{label} bėgimai rinkoje {market}'
      paragraph: Šis puslapis telkiasi į {label_lower} bėgimus ir padeda palyginti variantus, kai svarbus ir formatas, ir distancija.
    category:
      title: '{label} bėgimai rinkoje {market} | {site_name}'
      meta_description: Naršykite {label} bėgimus rinkoje {market}. Palyginkite datas, tipus ir vietas.
      h1: '{label} bėgimai rinkoje {market}'
      paragraph: Šis distancijos ir kategorijos puslapis surenka varžybas, atitinkančias {label}.
    race_type_category:
      title: '{label} {secondary_label} bėgimai rinkoje {market} | {site_name}'
      meta_description: Naršykite {label} bėgimus rinkoje {market} pagal tipą {secondary_label_lower}.
      h1: '{label} bėgimai rinkoje {market} ({secondary_label})'
      paragraph: Šis puslapis susiaurina kalendorių iki {label} varžybų {secondary_label_lower} tipe.
