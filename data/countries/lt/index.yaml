about_us:
  title: Apie bkmaratonas
  meta_description: bkmaratonas — jūsų gidas bėgimui Lietuvoje
  content:
    intro: Sveiki atvykę į bkmaratonas — išsamiausią bėgimo platformą Lietuvoje!
    mission: Mūsų misija — palengvinti bėgikams rasti ir dalintis informacija apie varžybas, treniruotes ir viską, kas susiję su bėgimu.
    story: bkmaratonas.lt pradėtas 2023 m. bėgikų bėgikams. Matėme poreikį moderniai platformai, kurioje galėtų susiburti Lietuvos bėgimo bendruomenė.
    features:
    - title: Išsamus bėgimų sąrašas
      description: Renkame Lietuvos bėgimus vienoje vietoje — nuo mažų vietinių varžybų iki didelių tarptautinių renginių.
    - title: Bendruomenės varoma
      description: Platformą valdo bėgikai kaip jūs. Kiekvienas gali pridėti varžybų informaciją ir dalyvauti diskusijose.
    - title: Nemokami įrankiai
      description: Siūlome greičio skaičiuoklę, treniruočių programas ir maršruto matavimą — nemokamai.
    closing: Toliau tobuliname platformą pagal naudotojų atsiliepimus. Turite pasiūlymų? Susisiekite su mumis!
contact:
  title: Susisiekite su mumis
  meta_description: Susisiekite su bkmaratonas.lt — esame čia, kad padėtume
  content:
    intro: 'Norime išgirsti iš jūsų! Štai kaip su mumis susisiekti:'
    email:
      title: El. paštas
      address: loppkartan@gmail.com
      description: Paprastai atsakome per 24 valandas darbo dienomis.
    social:
      title: Socialiniai tinklai
      description: 'Sekite mus socialiniuose tinkluose ir gaukite naujausią informaciją:'
    feedback:
      title: Atsiliepimai
      description: Vertiname visus atsiliepimus, kurie padeda tobulinti bkmaratonas.lt.
privacy_page:
  title: Privatumo politika
  meta_description: Privatumo politika ir informacija, kaip bkmaratonas tvarko asmens duomenis ir slapukus.
  last_updated_label: Paskutinį kartą atnaujinta
  last_updated_date: 2026 m. kovo 27 d.
  contact_intro: 'Privatumo klausimais ir užklausoms susisiekite su mumis:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Kokią informaciją renkame
    intro: 'Renkame informaciją, kurią pateikiate tiesiogiai, kai:'
    bullets:
    - sukurate paskyrą
    - pateikiate varžybų duomenis
    - rašote forume
    - susisiekiate su mumis
  - title: 2. Slapukai ir stebėjimas
    intro: 'Slapukus naudojame tam, kad:'
    bullets:
    - įsimintume jūsų nustatymus
    - išlaikytume seansą ir prisijungimo būseną
    - analizuotume srautą ir svetainės naudojimą
    - rodytume aktualią reklamą ir gerintume patirtį
  - title: 3. Kaip naudojame jūsų informaciją
    intro: 'Jūsų informacija padeda mums:'
    bullets:
    - teikti ir tobulinti paslaugas
    - siųsti svarbius pranešimus
    - atsakyti į užklausas
    - užkirsti kelią piktnaudžiavimui
  - title: 4. Jūsų teisės
    intro: 'Pagal BDAR turite teisę:'
    bullets:
    - susipažinti su savo asmens duomenimis
    - ištaisyti netikslius duomenis
    - prašyti ištrinti duomenis
    - nesutikti su tam tikru tvarkymu
    - prašyti duomenų perkeliamumo
  - title: 5. Susisiekite su mumis
    intro: Jei turite klausimų, kaip tvarkome asmens duomenis ar slapukus, visada galite su mumis susisiekti.
