    city:
      title: '{label} bėgimai | {site_name}'
      meta_description: Raskite bėgimus, susijusius su miestu {label}. Palyginkite datas, distancijas ir netoliese esančius variantus.
      h1: Bėgimai prie {label}
      paragraph: Šis miesto puslapis padeda naršyti su {label} susijusius bėgimus, įskaitant netoliese esančias alternatyvas.
