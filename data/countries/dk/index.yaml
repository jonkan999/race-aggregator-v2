about_us:
  title: Om Lobskalender
  meta_description: Lobskalender – din guide til løb i Danmark
  content:
    intro: Velkommen til Lobskalender – den mest komplette platform for løbere i Danmark!
    mission: Vores mission er at gøre det nemt for løbere at finde og dele information om løb, træning og alt, der har med løb at gøre.
    story: Lobskalender blev startet i 2023 af løbere for løbere. Vi så behovet for en moderne og brugervenlig platform, hvor løbefællesskabet kunne samles.
    features:
    - title: Komplet løbsliste
      description: Vi samler alle løb i Danmark ét sted – fra små lokale løb til store internationale løb.
    - title: Drevet af fællesskabet
      description: Vores platform drives af løbere som dig. Alle kan bidrage med information om løb og deltage i debatten.
    - title: Gratis værktøjer
      description: Vi tilbyder nyttige værktøjer som fartomformere, træningsprogrammer og ruteplanlægning – helt gratis.
    closing: Vi udvikler fortsat platformen ud fra feedback fra vores brugere. Har du forslag til forbedringer? Kontakt os gerne!
contact:
  title: Kontakt os
  meta_description: Kontakt Lobskalender – vi er her for at hjælpe dig
  content:
    intro: 'Vi vil gerne høre fra dig! Her er forskellige måder at komme i kontakt med os:'
    email:
      title: E-mail
      address: loppkartan@gmail.com
      description: Vi svarer normalt inden for 24 timer på hverdage.
    social:
      title: Sociale medier
      description: 'Følg os på sociale medier for de seneste nyheder og opdateringer:'
    feedback:
      title: Tilbagemelding
      description: Vi sætter pris på al feedback, der hjælper os med at forbedre Lobskalender.
privacy_page:
  title: Privatlivspolitik
  meta_description: Privatlivspolitik og information om, hvordan Lobskalender behandler persondata og cookies.
  last_updated_label: Sidst opdateret
  last_updated_date: 27. marts 2026
  contact_intro: 'Ved spørgsmål og anmodninger om privatliv kan du kontakte os på:'
  contact_email: loppkartan@gmail.com
  sections:
  - title: 1. Oplysninger, vi indsamler
    intro: 'Vi indsamler oplysninger, som du giver os direkte, når du:'
    bullets:
    - Opretter en konto
    - Indsender løbsoplysninger
    - Skriver i forummet
    - Kontakter os
  - title: 2. Cookies og sporing
    intro: 'Vi bruger cookies til at:'
    bullets:
    - Huske dine indstillinger
    - Opretholde din session og login-status
    - Analysere trafik og brug af siden
    - Vise relevant annoncering og forbedre oplevelsen
  - title: 3. Sådan bruger vi dine oplysninger
    intro: 'Dine oplysninger hjælper os med at:'
    bullets:
    - Levere og forbedre vores tjenester
    - Sende vigtige beskeder og opdateringer
    - Svare på henvendelser og supportspørgsmål
    - Forebygge svindel og misbrug
  - title: 4. Dine rettigheder
    intro: 'Ifølge GDPR har du ret til at:'
    bullets:
    - Få adgang til dine persondata
    - Rette unøjagtige eller ufuldstændige data
    - Anmode om sletning af dine data
    - Gøre indsigelse mod visse behandlinger
    - Anmode om dataportabilitet
  - title: 5. Kontakt os
    intro: Hvis du har spørgsmål om, hvordan vi behandler persondata eller bruger cookies, er du altid velkommen til at kontakte os.
