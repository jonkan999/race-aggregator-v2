seo_templates:
  title_parts:
    category: '{category}-løb'
    race_type: '{race_type}'
    location: i {location}
    default: Alle løb
  paragraph_templates:
    category_race_location: Find {category} {race_type}løb i {location}.
    category_race: Udforsk {category} {race_type}løb i hele Danmark.
    category_location: Opdag {category}-løb i {location}.
    race_location: Se alle {race_type}løb i {location}.
    category_only: Find {category}-løb i hele Danmark.
    race_only: Udforsk {race_type}løb i alle regioner.
    location_only: Se alle typer løb i {location}.
    default_suffix: Her finder du datoer, distancer og alle de oplysninger, du skal bruge for at planlægge dit næste løb.
  browse_page_templates:
    county:
      title: '{label} løb | {site_name}'
      meta_description: Gennemse motionsløb i {label}. Sammenlign datoer, distancer, løbsformater og praktiske detaljer, før du vælger dit næste løb.
      h1: Løb i {label}
      paragraph: Denne side samler motionsløb i {label}, så det er nemmere at sammenligne datoer, distancer, løbsformater og praktiske detaljer ét sted. Brug den, når du vil have et klarere overblik, før du vælger dit næste løb.
    city:
      title: '{label} løb | {site_name}'
      meta_description: Find motionsløb med tilknytning til {label}. Sammenlign datoer, distancer, nærliggende muligheder og praktiske detaljer, før du vælger dit næste løb.
      h1: Løb nær {label}
      paragraph: Denne byside hjælper dig med at gennemse motionsløb knyttet til {label}, inklusive nærliggende alternativer, der er relevante, når du planlægger en løbsdag eller en tur. Den er lavet for at gøre det hurtigere at finde og sammenligne lokale løb.
    month:
      title: '{label} løb | {site_name}'
      meta_description: Gennemse motionsløb i {label} i {market}. Sammenlign datoer, distancer, løbstyper og praktiske detaljer, før du planlægger din sæson.
      h1: Løb i {label}
      paragraph: Denne side er til løbere, der vil se kalenderen måned for måned og har brug for en hurtigere måde at sammenligne, hvad der sker i {label}. Den hjælper dig med at indsnævre feltet, før du går videre til distancer, underlag og løbssteder.
    race_type:
      title: '{label}-løb i {market} | {site_name}'
      meta_description: Gennemse {label_lower}-løb i {market}. Sammenlign datoer, distancer, steder og praktiske detaljer, før du vælger et løb, der passer til dig.
      h1: '{label}-løb i {market}'
      paragraph: Denne side fokuserer på {label_lower}-løb og giver et klarere overblik, når løbsformatet er lige så vigtigt som distancen. Brug den til at sammenligne muligheder på tværs af regioner, datoer og praktiske detaljer uden at starte i hele kalenderen.
    category:
      title: '{label}-løb i {market} | {site_name}'
      meta_description: Gennemse {label}-løb i {market}. Sammenlign datoer, løbstyper, steder og praktiske detaljer, før du beslutter dig for dit næste løb.
      h1: '{label}-løb i {market}'
      paragraph: Denne distance- og kategoriside samler løb, der matcher {label}, så det er nemmere at sammenligne relevante muligheder ét sted. Den er lavet til løbere, der vil gå hurtigere fra bred gennemgang til en kortliste med realistiske løb.
    race_type_category:
      title: '{label} {secondary_label}-løb i {market} | {site_name}'
      meta_description: Gennemse {label}-løb i {market} inden for løbstypen {secondary_label_lower}. Sammenlign datoer, steder og praktiske detaljer, før du vælger dit næste løb.
      h1: '{label}-løb i {market} ({secondary_label})'
      paragraph: Denne side indsnævrer kalenderen til {label}-løb inden for løbstypen {secondary_label_lower}, hvilket er nyttigt, når både distance og løbsformat afgør det rigtige valg. Brug den til at sammenligne ensartede muligheder, før du tilmelder dig.
    race_type_county:
      title: '{secondary_label}-løb i {label} | {site_name}'
      meta_description: Gennemse {secondary_label_lower}-løb i {label}. Sammenlign datoer, distancer og praktiske detaljer, før du vælger dit næste løb.
      h1: '{secondary_label}-løb i {label}'
      paragraph: Denne side fokuserer på {secondary_label_lower}-løb i {label}, så det er nemmere at sammenligne mere relevante muligheder i samme region. Den er nyttig, når både geografi og løbsformat former kortlisten.
    race_type_month:
      title: '{secondary_label}-løb i {label} | {site_name}'
      meta_description: Gennemse {secondary_label_lower}-løb i {label_lower}. Sammenlign datoer, distancer og praktiske detaljer, mens du planlægger sæsonen.
      h1: '{secondary_label}-løb i {label}'
      paragraph: Denne side samler {secondary_label_lower}-løb i {label_lower} til løbere, der planlægger efter kalenderen først. Den hjælper dig med at sammenligne lignende løbsformater, før du indsnævrer yderligere efter sted eller distance.
    race_type_city:
      title: '{secondary_label}-løb nær {label} | {site_name}'
      meta_description: Gennemse {secondary_label_lower}-løb knyttet til {label}. Sammenlign datoer, distancer og nærliggende muligheder, før du vælger dit næste løb.
      h1: '{secondary_label}-løb nær {label}'
      paragraph: Denne side samler {secondary_label_lower}-løb knyttet til {label}, så lokale løb er hurtigere at sammenligne. Den er nyttig, når du vil have et bestemt løbsformat nær én by uden at starte i hele kalenderen.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'You write evergreen SEO copy for indexable running race browse pages. Write for humans first, search intent second. Output valid JSON only. Keep the copy timeless: never mention a current year, current counts, limited-time wording, or freshness claims. Avoid keyword stuffing, hype, clickbait, superlatives, and unverifiable claims. Make each page clearly distinct based on the provided route context. Use natural Danish suitable for a running calendar in Denmark. Prefer concise titles, concise H1s, meta descriptions around 120-160 characters when practical, and a paragraph of 2-3 short sentences.'
  browse_guidance:
    county: Brugeren vil finde løb i én region.
    city: Brugeren vil finde løb knyttet til en by eller en by i nærheden.
    month: Brugeren vil finde løb efter måned.
    race_type: Brugeren vil finde en bestemt løbstype.
    category: Brugeren vil finde en bestemt distance eller løbskategori.
    race_type_category: Brugeren vil finde en bestemt distance/kategori inden for én løbstype.
    race_type_county: Brugeren vil finde en bestemt løbstype i én region.
    race_type_month: Brugeren vil finde en bestemt løbstype i én måned.
    race_type_city: Brugeren vil finde en bestemt løbstype knyttet til én by.
