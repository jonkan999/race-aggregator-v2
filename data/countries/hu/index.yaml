seo_templates:
  title_parts:
    category: '{category} versenyek'
    race_type: '{race_type}'
    location: itt {location}
    default: Összes verseny
  paragraph_templates:
    category_race_location: 'Találj {category} {race_type} versenyeket itt: {location}.'
    category_race: Fedezz fel {category} {race_type} versenyeket Magyarország egész területén.
    category_location: 'Fedezz fel {category} versenyeket itt: {location}.'
    race_location: 'Nézd meg az összes {race_type} versenyt itt: {location}.'
    category_only: Találj {category} versenyeket Magyarország egész területén.
    race_only: Fedezz fel {race_type} versenyeket minden régióban.
    location_only: 'Nézd meg az összes versenytípust itt: {location}.'
    default_suffix: Itt megtalálod a dátumokat, távokat és minden fontos információt a következő versenyed megtervezéséhez.
  browse_page_templates:
    county:
      title: '{label} versenyek | {site_name}'
      meta_description: 'Böngészd a futóversenyeket itt: {label}. Hasonlítsd össze a dátumokat, távokat, versenyformátumokat és gyakorlati részleteket, mielőtt kiválasztod a következő versenyedet.'
      h1: 'Versenyek itt: {label}'
      paragraph: 'Ez az oldal összegyűjti a futóversenyeket itt: {label}, hogy könnyebb legyen egy helyen összehasonlítani a dátumokat, távokat, versenyformátumokat és gyakorlati részleteket. Akkor hasznos, ha tisztább áttekintést szeretnél a következő verseny kiválasztása előtt.'
    city:
      title: '{label} versenyek | {site_name}'
      meta_description: 'Találj futóversenyeket, amelyek kapcsolódnak ehhez a városhoz: {label}. Hasonlítsd össze a dátumokat, távokat, közeli lehetőségeket és gyakorlati részleteket, mielőtt kiválasztod a következő versenyedet.'
      h1: Versenyek {label} közelében
      paragraph: Ez a városi oldal segít böngészni a(z) {label} városhoz kapcsolódó futóversenyeket, beleértve a közeli alternatívákat is, amelyek hasznosak lehetnek egy versenynap vagy utazás megtervezésekor. Azért készült, hogy gyorsabbá és könnyebben összehasonlíthatóvá tegye a helyi versenykeresést.
    month:
      title: '{label} versenyek | {site_name}'
      meta_description: 'Böngészd a futóversenyeket itt: {label}, ebben a piacon: {market}. Hasonlítsd össze a dátumokat, távokat, versenytípusokat és gyakorlati részleteket, mielőtt megtervezed a szezonodat.'
      h1: 'Versenyek ekkor: {label}'
      paragraph: 'Ez az oldal azoknak a futóknak szól, akik hónap szerinti nézetben szeretnék látni a naptárat, és gyorsabban akarják összehasonlítani, mi történik ekkor: {label}. Segít szűkíteni a lehetőségeket, mielőtt belemerülnél a távokba, borításokba és helyszínekbe.'
    race_type:
      title: '{label} versenyek itt: {market} | {site_name}'
      meta_description: 'Böngészd a(z) {label_lower} versenyeket itt: {market}. Hasonlítsd össze a dátumokat, távokat, helyszíneket és gyakorlati részleteket, mielőtt kiválasztod a hozzád illő versenyt.'
      h1: '{label} versenyek itt: {market}'
      paragraph: Ez az oldal a(z) {label_lower} versenyekre fókuszál, és átláthatóbb képet ad, amikor a versenyformátum legalább annyira fontos, mint a táv. Használd arra, hogy régiók, dátumok és gyakorlati részletek szerint hasonlítsd össze a lehetőségeket anélkül, hogy a teljes naptárból kellene kiindulnod.
    category:
      title: '{label} versenyek itt: {market} | {site_name}'
      meta_description: 'Böngészd a(z) {label} versenyeket itt: {market}. Hasonlítsd össze a dátumokat, versenytípusokat, helyszíneket és gyakorlati részleteket, mielőtt döntesz a következő eseményedről.'
      h1: '{label} versenyek itt: {market}'
      paragraph: Ez a táv- és kategóriaoldal egy helyre gyűjti a(z) {label} címkéhez illő versenyeket, hogy könnyebb legyen összehasonlítani a releváns lehetőségeket. Azoknak a futóknak készült, akik gyorsabban szeretnének eljutni az általános böngészéstől egy reális rövidlistáig.
    race_type_category:
      title: '{label} {secondary_label} versenyek itt: {market} | {site_name}'
      meta_description: 'Böngészd a(z) {label} versenyeket itt: {market}, a(z) {secondary_label_lower} versenytípuson belül. Hasonlítsd össze a dátumokat, helyszíneket és gyakorlati részleteket, mielőtt kiválasztod a következő eseményedet.'
      h1: '{label} versenyek itt: {market} ({secondary_label})'
      paragraph: Ez az oldal a naptárat a(z) {secondary_label_lower} versenytípuson belüli {label} versenyekre szűkíti, ami hasznos, amikor a táv és a versenyformátum együtt határozza meg a jó választást. Használd arra, hogy valóban összeillő lehetőségeket vess össze, mielőtt elköteleződsz egy verseny mellett.
    race_type_county:
      title: '{secondary_label} versenyek itt: {label} | {site_name}'
      meta_description: 'Böngészd a(z) {secondary_label_lower} versenyeket itt: {label}. Hasonlítsd össze a dátumokat, távokat és gyakorlati részleteket, mielőtt kiválasztod a következő versenyedet.'
      h1: '{secondary_label} versenyek itt: {label}'
      paragraph: Ez az oldal a(z) {label} területén rendezett {secondary_label_lower} versenyekre fókuszál, így könnyebb összehasonlítani a relevánsabb lehetőségeket ugyanazon a régión belül. Akkor hasznos, ha a földrajzi elhelyezkedés és a versenyformátum is meghatározza a rövidlistát.
    race_type_month:
      title: '{secondary_label} versenyek ekkor: {label} | {site_name}'
      meta_description: 'Böngészd a(z) {secondary_label_lower} versenyeket ekkor: {label_lower}. Hasonlítsd össze a dátumokat, távokat és gyakorlati részleteket, miközben megtervezed a szezonodat.'
      h1: '{secondary_label} versenyek ekkor: {label}'
      paragraph: 'Ez az oldal a(z) {secondary_label_lower} versenyeket gyűjti össze ekkor: {label_lower}, azoknak a futóknak, akik először a naptár alapján terveznek. Segít összehasonlítani a hasonló versenyformátumokat, mielőtt tovább szűkítenél helyszín vagy táv szerint.'
    race_type_city:
      title: '{secondary_label} versenyek {label} közelében | {site_name}'
      meta_description: 'Böngészd a(z) {secondary_label_lower} versenyeket, amelyek kapcsolódnak ehhez a városhoz: {label}. Hasonlítsd össze a dátumokat, távokat és a közeli lehetőségeket, mielőtt kiválasztod a következő versenyedet.'
      h1: '{secondary_label} versenyek {label} közelében'
      paragraph: Ez az oldal a(z) {label} városhoz kapcsolódó {secondary_label_lower} versenyeket gyűjti egybe, hogy gyorsabban lehessen összehasonlítani a helyi lehetőségeket. Akkor hasznos, ha egy adott versenyformátumot keresel egy város közelében anélkül, hogy a teljes naptárból kellene kiindulnod.
seo_generation:
  browse_model: gpt-5-mini
  browse_system_prompt: 'Örökzöld SEO-szöveget írsz indexelhető futóverseny-böngésző oldalakhoz. Elsősorban embereknek írj, másodsorban keresési szándékra optimalizálj. Kizárólag érvényes JSON-t adj vissza. A szöveg legyen időtálló: soha ne említs aktuális évet, aktuális darabszámot, időkorlátos megfogalmazást vagy frissességi állítást. Kerüld a kulcsszóhalmozást, a hype-ot, a clickbaitet, a túlzó állításokat és a nem igazolható kijelentéseket. Minden oldal legyen egyértelműen különböző a megadott útvonalkontextus alapján. Természetes magyar nyelvet használj, amely illik egy magyar futónaptárhoz. Törekedj rövid címekre, rövid H1-ekre, lehetőleg 120-160 karakter közötti meta leírásokra, valamint 2-3 rövid mondatból álló bekezdésre.'
  browse_guidance:
    county: A felhasználó egy adott régió versenyeit keresi.
    city: A felhasználó egy városhoz vagy közeli városhoz kapcsolódó versenyeket keresi.
    month: A felhasználó hónap szerint keres versenyeket.
    race_type: A felhasználó egy adott versenytípust keres.
    category: A felhasználó egy adott távot vagy versenykategóriát keres.
    race_type_category: A felhasználó egy adott távot vagy kategóriát keres egy versenytípuson belül.
    race_type_county: A felhasználó egy adott versenytípust keres egy régióban.
    race_type_month: A felhasználó egy adott versenytípust keres egy hónapban.
    race_type_city: A felhasználó egy adott versenytípust keres egy városhoz kapcsolódva.
