about_us:
  title: A Futásnaptárról
  meta_description: Futásnaptár - útmutatód a magyarországi futáshoz
  content:
    intro: Üdvözlünk a Futásnaptárnál - az egyik legátfogóbb platformnál a magyar futók számára!
    mission: Küldetésünk, hogy megkönnyítsük a futók számára a versenyekkel, edzéssel és minden futással kapcsolatos információ megtalálását és megosztását.
    story: A Futásnaptár 2026-ban indult futóktól futóknak. Úgy láttuk, szükség van egy modern és jól használható felületre, ahol a magyar futóközösség egy helyen találkozhat.
    features:
    - title: Teljes versenynaptár
      description: Magyarország futóversenyeit gyűjtjük egy helyre - a kisebb helyi eseményektől a nagyobb célversenyekig.
    - title: Közösség által építve
      description: A platformot hozzád hasonló futók mozgatják. Bárki hozzájárulhat versenyinformációkkal és részt vehet a beszélgetésekben.
    - title: Ingyenes eszközök
      description: Hasznos eszközöket kínálunk, például tempókalkulátort, edzésterveket és útvonaltervezést - teljesen ingyen.
    closing: A platformot folyamatosan fejlesztjük a felhasználóink visszajelzései alapján. Van fejlesztési javaslatod? Lépj velünk kapcsolatba!
contact:
  title: Kapcsolat
  meta_description: Lépj kapcsolatba a Futásnaptárral - itt vagyunk, hogy segítsünk
  content:
    intro: 'Örömmel hallunk felőled! Itt többféleképpen is elérhetsz minket:'
    email:
      title: E-mail
      address: hello@futasnaptar.com
      description: Hétköznapokon általában 24 órán belül válaszolunk.
    social:
      title: Közösségi média
      description: 'Kövess minket a közösségi médiában a legfrissebb hírekért és frissítésekért:'
    feedback:
      title: Visszajelzés
      description: Nagyra értékelünk minden visszajelzést, amely segít jobbá tenni a Futásnaptárt.
privacy_page:
  title: Adatvédelmi szabályzat
  meta_description: Adatvédelmi tájékoztató arról, hogyan kezeli a Futásnaptár a személyes adatokat és a sütiket.
  last_updated_label: Utolsó frissítés
  last_updated_date: 2026. március 27.
  contact_intro: 'Adatvédelemmel kapcsolatos kérdések vagy kérések esetén írj nekünk ide:'
  contact_email: hello@futasnaptar.com
  sections:
  - title: 1. Milyen adatokat gyűjtünk
    intro: 'Azokat az információkat gyűjtjük, amelyeket közvetlenül te adsz meg nekünk, amikor:'
    bullets:
    - fiókot hozol létre
    - versenyinformációt küldesz be
    - bejegyzést írsz a fórumba
    - kapcsolatba lépsz velünk
  - title: 2. Sütik és követés
    intro: 'A sütiket a következőkre használjuk:'
    bullets:
    - megjegyezzük a beállításaidat
    - fenntartsuk a munkamenetedet és a bejelentkezési állapotodat
    - elemezzük a forgalmat és az oldalhasználatot
    - releváns hirdetéseket mutassunk és javítsuk a felhasználói élményt
  - title: 3. Hogyan használjuk az adataidat
    intro: 'Az adataid abban segítenek nekünk, hogy:'
    bullets:
    - biztosítsuk és fejlesszük a szolgáltatásainkat
    - fontos értesítéseket és frissítéseket küldjünk
    - válaszoljunk a kéréseidre és támogatási kérdéseidre
    - megelőzzük a csalást és a visszaéléseket
  - title: 4. A jogaid
    intro: 'A GDPR alapján jogod van a következőkhöz:'
    bullets:
    - hozzáférj a személyes adataidhoz
    - helyesbíttesd a pontatlan vagy hiányos adatokat
    - kérd az adataid törlését
    - tiltakozz bizonyos adatkezelési tevékenységek ellen
    - kérd az adathordozhatóságot
  - title: 5. Kapcsolat
    intro: Ha kérdésed van arról, hogyan kezeljük a személyes adatokat vagy hogyan használjuk a sütiket, bármikor felveheted velünk a kapcsolatot.
